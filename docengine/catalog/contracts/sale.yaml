id: sale
kind: contract
family: sale
name:
  ru: Договор купли-продажи
  kk: Сатып алу-сату шарты
  en: Sale and Purchase Agreement
summary:
  ru: Продавец обязуется передать товар в собственность покупателю, а покупатель — принять товар и уплатить за него цену.
  kk: Сатушы тауарды сатып алушының меншігіне беруге, ал сатып алушы тауарды қабылдап, оның бағасын төлеуге міндеттенеді.
  en: The seller undertakes to transfer goods into the buyer's ownership, and the buyer to accept the goods and pay the price.
form:
  ru: Простая письменная. Для недвижимости и иного имущества, права на которое подлежат регистрации, — с государственной регистрацией перехода права собственности.
  kk: Жай жазбаша нысан. Жылжымайтын мүлік үшін — меншік құқығының ауысуын мемлекеттік тіркеумен.
  en: Simple written form; transfer of title to real estate requires state registration.
caveat:
  ru: >-
    Договор купли-продажи недвижимости не порождает права собственности сам по себе: право переходит
    с момента государственной регистрации (ст. 238 ГК РК и Закон РК «О государственной регистрации прав
    на недвижимое имущество»). Отдельные виды продаж регулируются специальными параграфами гл. 25 ГК РК
    (розничная купля-продажа, поставка, контрактация, энергоснабжение, продажа предприятия) — при их
    признаках применяются специальные нормы, а не общие. Продажа доли в ТОО, транспортного средства и
    ряда иных объектов требует нотариальной формы либо перерегистрации в уполномоченном органе.
  en: Title to real estate passes only upon state registration; special sub-chapters of the Civil Code may apply.
legal_basis:
  - {act: ГК РК, article: '406', note: 'договор купли-продажи, гл. 25'}
  - {act: ГК РК, article: '407', note: 'условие о товаре: наименование и количество'}
  - {act: ГК РК, article: '408–413', note: 'обязанность передать товар и срок передачи'}
  - {act: ГК РК, article: '422–428', note: 'качество товара, гарантийный срок'}
  - {act: ГК РК, article: '438–442', note: 'цена, оплата, предоплата, кредит и рассрочка'}
  - {act: ГК РК, article: '393', note: 'существенные условия договора'}
  - {act: ГК РК, article: '238', note: 'момент возникновения права собственности у приобретателя'}
parties:
  - role: {ru: 'Продавец', kk: 'Сатушы', en: 'Seller'}
    kinds: [legal, individual, ip]
  - role: {ru: 'Покупатель', kk: 'Сатып алушы', en: 'Buyer'}
    kinds: [legal, individual, ip]
fields:
  - name: subject
    label: {ru: 'Предмет договора (наименование товара)', kk: 'Шарттың мәні (тауар атауы)', en: 'Subject (description of goods)'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: Наименование, вид, марка, модель, идентифицирующие признаки. Для недвижимости — кадастровый номер и адрес; для транспорта — VIN, госномер.
    example:
      ru: >-
        Погрузчик вилочный Toyota 8FG25, 2024 года выпуска, грузоподъёмность 2500 кг, заводской номер 8FG25-70412, комплектация: боковой сместитель, кабина оператора.
      kk: >-
        Toyota 8FG25 шанышқылы тиегіші, 2024 жылы шыққан, жүк көтергіштігі 2500 кг, зауыттық нөмірі 8FG25-70412.
  - name: quantity
    label: {ru: 'Количество', kk: 'Саны', en: 'Quantity'}
    type: text
    group: subject
    required: true
    unit: 'шт./кг/м²'
    hint:
      ru: >-
        Количество либо порядок его определения. Без количества условие о товаре не согласовано (ст. 407 ГК РК).
    example:
      ru: '1 единица'
      kk: '1 дана'
  - name: quality_requirements
    label: {ru: 'Требования к качеству', kk: 'Сапаға қойылатын талаптар', en: 'Quality requirements'}
    type: textarea
    group: subject
    required: false
    hint:
      ru: >-
        Стандарт, ТУ, техпаспорт, образец. Если не указано — товар должен быть пригоден для обычного использования.
    example:
      ru: >-
        Товар новый, не бывший в эксплуатации, соответствует техническому паспорту завода-изготовителя и требованиям технического регламента Таможенного союза ТР ТС 010/2011.
      kk: >-
        Тауар жаңа, пайдаланылмаған, дайындаушы зауыттың техникалық паспортына сәйкес келеді.
  - name: price
    label: {ru: 'Цена', kk: 'Бағасы', en: 'Price'}
    type: money
    group: terms
    required: true
    unit: тенге
    hint:
      ru: >-
        Укажите, включает ли цена НДС, и цену за единицу, если товаров несколько.
    example:
      ru: '14 900 000'
  - name: payment_terms
    label: {ru: 'Порядок оплаты', kk: 'Төлем тәртібі', en: 'Payment terms'}
    type: select
    group: terms
    required: true
    options:
      - {value: prepayment, label: {ru: Предоплата 100%, kk: 100% алдын ала төлем, en: 100% prepayment}}
      - {value: postpayment, label: {ru: Оплата после передачи товара, kk: Тауарды бергеннен кейінгі төлем, en: Payment after delivery}}
      - {value: partial_prepayment, label: {ru: Частичная предоплата, kk: Ішінара алдын ала төлем, en: Partial prepayment}}
      - {value: installment, label: {ru: Рассрочка платежа, kk: Бөліп төлеу, en: Payment by instalments}}
    example:
      ru: 'partial_prepayment'
  - name: payment_deadline
    label: {ru: 'Срок оплаты', kk: 'Төлем мерзімі', en: 'Payment deadline'}
    type: text
    group: terms
    required: false
    hint:
      ru: >-
        Например: в течение 5 банковских дней с даты подписания акта приёма-передачи.
    example:
      ru: >-
        30 % в течение 3 банковских дней с даты подписания, остаток — в течение 10 банковских дней с даты подписания акта приёма-передачи
      kk: >-
        Қол қойылған күннен бастап 3 банк күні ішінде 30 %, қалғаны — қабылдау-тапсыру актісіне қол қойылған күннен бастап 10 банк күні ішінде
  - name: delivery_terms
    label: {ru: 'Условия передачи товара', kk: 'Тауарды беру шарттары', en: 'Delivery terms'}
    type: textarea
    group: terms
    required: true
    hint:
      ru: >-
        Место передачи, кто несёт расходы по доставке, момент перехода риска случайной гибели.
    example:
      ru: >-
        Самовывоз со склада продавца по адресу: г. Алматы, ул. Рыскулова, 103, в течение 5 рабочих дней с даты поступления предоплаты. Погрузка — силами продавца.
      kk: >-
        Сатушының Алматы қ., Рысқұлов к-сі, 103 мекенжайындағы қоймасынан өз күшімен әкету, алдын ала төлем түскен күннен бастап 5 жұмыс күні ішінде.
  - name: delivery_date
    label: {ru: 'Срок передачи товара', kk: 'Тауарды беру мерзімі', en: 'Delivery date'}
    type: date
    group: terms
    required: false
    example:
      ru: '2026-10-15'
  - name: warranty
    label: {ru: 'Гарантийный срок', kk: 'Кепілдік мерзімі', en: 'Warranty period'}
    type: text
    group: extra
    required: false
    hint:
      ru: >-
        Если гарантия не установлена, требования по качеству предъявляются в разумный срок, но не более двух лет (ст. 428 ГК РК).
    example:
      ru: '12 месяцев с даты подписания акта приёма-передачи'
      kk: 'Қабылдау-тапсыру актісіне қол қойылған күннен бастап 12 ай'
  - name: penalty_rate
    label: {ru: 'Неустойка за просрочку', kk: 'Мерзімін өткізгені үшін тұрақсыздық айыбы', en: 'Late-payment penalty'}
    type: number
    group: extra
    required: false
    unit: '% в день'
    example:
      ru: '0.1'
  - name: registration_needed
    label: {ru: 'Требуется государственная регистрация', kk: 'Мемлекеттік тіркеу талап етіледі', en: 'State registration required'}
    type: select
    group: extra
    required: false
    options:
      - {value: 'no', label: {ru: Нет, kk: Жоқ, en: 'No'}}
      - {value: 'yes', label: {ru: 'Да (недвижимость, транспорт, доля)', kk: 'Иә', en: 'Yes'}}
sections:
  - key: subject
    title: {ru: 'Предмет договора', kk: 'Шарттың мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Назвать товар так, чтобы его можно было выделить среди прочих: наименование, вид, марка, модель,
        идентифицирующие признаки (VIN, кадастровый номер, серийный номер), количество и единицу измерения.
        Прямо указать, что продавец является собственником товара, что товар не заложен, не арестован, не
        обременён правами третьих лиц и в споре не состоит. Сослаться на ст. 406 и п. 2 ст. 407 ГК РК:
        условие о товаре согласовано, если позволяет определить наименование и количество.
    refs:
      - {act: ГК РК, article: '406'}
      - {act: ГК РК, article: '407', note: 'п. 2'}
  - key: price
    title: {ru: 'Цена и порядок расчётов', kk: 'Бағасы және есеп айырысу тәртібі', en: 'Price and payment'}
    guidance:
      ru: >-
        Указать цену цифрами и прописью, валюту (расчёты между резидентами РК — в тенге), включён ли НДС и
        по какой ставке. Раскрыть способ оплаты (наличный, безналичный на счёт, указанный в реквизитах),
        срок платежа и момент, когда обязательство по оплате считается исполненным (списание со счёта
        покупателя или зачисление на счёт продавца — выбрать одно). При предоплате сослаться на ст. 440 ГК РК,
        при продаже в кредит — на ст. 441, при рассрочке — на ст. 442 с указанием размера и сроков платежей.
    refs:
      - {act: ГК РК, article: '438'}
      - {act: ГК РК, article: '439–442'}
  - key: delivery
    title: {ru: 'Порядок передачи товара', kk: 'Тауарды беру тәртібі', en: 'Delivery of goods'}
    guidance:
      ru: >-
        Определить срок и место передачи, способ (самовывоз, доставка силами продавца, передача перевозчику),
        сторону, несущую расходы по доставке и страхованию. Указать документ, которым оформляется передача
        (акт приёма-передачи, накладная, счёт-фактура), и прямо зафиксировать момент перехода риска случайной
        гибели и повреждения товара. Для товаров, требующих регистрации, отдельным пунктом описать, кто и в
        какой срок подаёт документы на регистрацию и за чей счёт.
    refs:
      - {act: ГК РК, article: '408–413'}
      - {act: ГК РК, article: '238'}
  - key: quality
    title: {ru: 'Качество товара и гарантии', kk: 'Тауар сапасы және кепілдіктер', en: 'Quality and warranties'}
    guidance:
      ru: >-
        Установить требования к качеству (стандарт, техническая документация, образец), комплектность и
        принадлежности, срок гарантии и порядок его исчисления. Описать порядок предъявления претензий по
        качеству и количеству: срок осмотра, форма уведомления, срок ответа продавца, порядок вызова
        представителя и составления акта о выявленных недостатках. Перечислить права покупателя при передаче
        товара ненадлежащего качества по ст. 428 ГК РК: соразмерное уменьшение цены, безвозмездное устранение
        недостатков, возмещение расходов на их устранение, а при существенном нарушении — отказ от договора.
    refs:
      - {act: ГК РК, article: '422–428'}
  - key: rights_obligations
    title: {ru: 'Права и обязанности сторон', kk: 'Тараптардың құқықтары мен міндеттері', en: 'Rights and obligations'}
    guidance:
      ru: >-
        Раздельными подпунктами перечислить обязанности продавца (передать товар в срок, свободным от прав
        третьих лиц, с документами и принадлежностями, в согласованной таре) и покупателя (принять товар,
        осмотреть его, оплатить в срок, подписать акт). Указать право продавца приостановить передачу при
        неполучении предоплаты и право покупателя отказаться от товара, не соответствующего условиям договора.
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Установить неустойку за просрочку передачи товара и за просрочку оплаты в процентах от стоимости за
        каждый день, с указанием предельного размера. Указать, является ли неустойка зачётной по отношению к
        убыткам. Сослаться на ст. 293 ГК РК (неустойка), ст. 353 ГК РК (проценты за неправомерное пользование
        чужими деньгами) и ст. 359 ГК РК (основания ответственности; предприниматель отвечает без вины, если
        иное не предусмотрено договором).
    refs:
      - {act: ГК РК, article: '293'}
      - {act: ГК РК, article: '353'}
      - {act: ГК РК, article: '359'}
  - key: force_majeure
    title: {ru: 'Обстоятельства непреодолимой силы', kk: 'Еңсерілмейтін күш жағдайлары', en: 'Force majeure'}
    guidance:
      ru: >-
        Перечислить обстоятельства непреодолимой силы, срок уведомления другой стороны (обычно 5–10 дней),
        подтверждающий документ (справка НПП «Атамекен» или иного компетентного органа) и срок, по истечении
        которого стороны вправе отказаться от договора без ответственности.
    refs:
      - {act: ГК РК, article: '359', note: 'п. 2'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Закрепить обязательный претензионный порядок с указанием срока ответа на претензию (обычно 15–30
        календарных дней), а затем подсудность: специализированный межрайонный экономический суд по месту
        нахождения ответчика либо конкретный арбитраж. Указать применимое право — право Республики Казахстан.
  - key: term
    title: {ru: 'Срок действия договора', kk: 'Шарттың қолданылу мерзімі', en: 'Term'}
    guidance:
      ru: >-
        Указать дату вступления договора в силу и момент прекращения — до полного исполнения сторонами
        обязательств. Отдельно оговорить, что окончание срока действия не освобождает от ответственности за
        нарушения, допущенные в период действия.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Указать порядок изменения и расторжения (только письменным соглашением сторон), количество экземпляров
        и их равную силу, язык договора (при двуязычии — какая версия имеет преимущество), порядок обмена
        юридически значимыми сообщениями и признание сканов и электронной подписи, перечень приложений.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Привести полные реквизиты обеих сторон: наименование или ФИО, БИН или ИИН, юридический и фактический
        адрес, банковские реквизиты (IBAN, БИК, банк), телефон, электронную почту, должность и ФИО подписанта
        и основание его полномочий (устав, доверенность с номером и датой).
essential_terms:
  - key: subject
    label: {ru: 'Предмет: наименование и количество товара', kk: 'Мәні: тауардың атауы мен саны', en: 'Subject: name and quantity of goods'}
    fields: [subject, quantity]
    section: subject
    basis: {act: ГК РК, article: '407', note: 'п. 2'}
  - key: price
    label: {ru: 'Цена товара', kk: 'Тауар бағасы', en: 'Price of goods'}
    fields: [price]
    section: price
    basis: {act: ГК РК, article: '438'}
risks:
  - party: 0
    text:
      ru: >-
        Покупатель принял товар и не платит; товар уже выбыл из владения продавца.
    mitigation:
      ru: >-
        Предусмотреть предоплату или сохранение права собственности за продавцом до полной оплаты (ст. 413 ГК РК), а также неустойку за просрочку оплаты.
  - party: 0
    text:
      ru: >-
        Покупатель заявляет претензии по качеству спустя длительное время после передачи.
    mitigation:
      ru: >-
        Установить короткий срок осмотра и предъявления претензий, фиксировать состояние товара в акте приёма-передачи с фотографиями.
  - party: 1
    text:
      ru: >-
        Товар обременён правами третьих лиц, находится в залоге или под арестом, и может быть изъят у покупателя.
    mitigation:
      ru: >-
        Включить заверение продавца об отсутствии обременений, проверить сведения в реестре залогов и обязать продавца возместить убытки при изъятии (эвикции).
  - party: 1
    text:
      ru: >-
        Внесена предоплата, а товар не передан в срок.
    mitigation:
      ru: >-
        Предусмотреть право требовать возврата предоплаты с процентами по ст. 440 ГК РК и неустойку за просрочку передачи.
  - party: 1
    text:
      ru: >-
        Товар передан некомплектным или с недостатками, выявленными при эксплуатации.
    mitigation:
      ru: >-
        Установить гарантийный срок и порядок безвозмездного устранения недостатков, удерживать часть оплаты до истечения приёмки.
annexes:
  - key: specification
    title: {ru: 'Спецификация товара', kk: 'Тауар ерекшелігі', en: 'Specification of goods'}
    kind: table
    default: true
    columns:
      - {ru: '№', en: 'No.'}
      - {ru: Наименование, kk: Атауы, en: Item}
