id: lease
kind: contract
family: lease
name:
  ru: Договор аренды (имущественного найма)
  kk: Мүлікті жалдау (жалға алу) шарты
  en: Lease Agreement
summary:
  ru: Арендодатель обязуется предоставить арендатору имущество за плату во временное владение и пользование, а арендатор — вносить арендную плату и вернуть имущество по окончании срока.
  kk: Жалға беруші мүлікті ақы үшін уақытша иеленуге және пайдалануға беруге, ал жалға алушы жалдау ақысын төлеп, мерзім аяқталғанда мүлікті қайтаруға міндеттенеді.
  en: The lessor provides property for temporary possession and use for a fee; the lessee pays rent and returns the property at the end of the term.
form:
  ru: Простая письменная. Аренда недвижимости на срок свыше одного года подлежит государственной регистрации.
  kk: Жай жазбаша нысан. Бір жылдан асатын мерзімге жылжымайтын мүлікті жалдау мемлекеттік тіркеуге жатады.
  en: Simple written form; leases of real estate for more than one year are subject to state registration.
caveat:
  ru: >-
    В ГК РК глава 29 называется «Имущественный наем (аренда)», стороны в кодексе — наймодатель и наниматель;
    в обороте и в тексте договора обычно пишут «арендодатель» и «арендатор» — это допустимо и равнозначно.
    Договор аренды (обременение) недвижимого имущества, заключённый на срок один год и более, подлежит
    государственной регистрации в органе юстиции; без регистрации право аренды непротивопоставимо третьим
    лицам. Отдельные виды найма (лизинг, прокат, аренда предприятия, аренда земельного участка, наём жилища)
    регулируются специальными нормами: аренда земли — Земельным кодексом РК, наём жилища — главой 30 ГК РК и
    Законом РК «О жилищных отношениях».
  en: Chapter 29 of the Civil Code calls this "property hire"; leases of real estate for a year or more require state registration; land and housing leases follow special laws.
legal_basis:
  - {act: ГК РК, article: '540', note: 'договор имущественного найма, гл. 29'}
  - {act: ГК РК, article: '541', note: 'объекты имущественного найма'}
  - {act: ГК РК, article: '543–545', note: 'форма, регистрация и срок договора'}
  - {act: ГК РК, article: '546', note: 'плата за пользование имуществом'}
  - {act: ГК РК, article: '552–554', note: 'обязанности сторон по содержанию и ремонту имущества'}
  - {act: ГК РК, article: '556–558', note: 'изменение и досрочное расторжение договора'}
  - {act: ГК РК, article: '393', note: 'существенные условия договора'}
parties:
  - role: {ru: 'Арендодатель', kk: 'Жалға беруші', en: 'Lessor'}
    kinds: [legal, individual, ip]
  - role: {ru: 'Арендатор', kk: 'Жалға алушы', en: 'Lessee'}
    kinds: [legal, individual, ip]
fields:
  - name: property_description
    label: {ru: 'Описание передаваемого имущества', kk: 'Берілетін мүліктің сипаттамасы', en: 'Description of the leased property'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Точная индивидуализация: адрес, кадастровый номер, этаж, номер помещения, для оборудования — марка и серийный номер.
    example:
      ru: >-
        Нежилое помещение общей площадью 84,5 кв. м на 3 этаже административного здания по адресу: г. Алматы, ул. Тимирязева, 42, кадастровый номер 20-315-041-1284, помещения № 305–308.
      kk: >-
        Алматы қ., Тимирязев к-сі, 42 мекенжайындағы әкімшілік ғимараттың 3-қабатындағы жалпы ауданы 84,5 шаршы метр тұрғын емес үй-жай, кадастрлық нөмірі 20-315-041-1284, № 305–308 үй-жайлар.
  - name: property_area
    label: {ru: 'Площадь', kk: 'Ауданы', en: 'Area'}
    type: number
    group: subject
    required: false
    unit: м²
    example:
      ru: '84.5'
  - name: property_condition
    label: {ru: 'Состояние имущества при передаче', kk: 'Беру кезіндегі мүліктің жай-күйі', en: 'Condition at handover'}
    type: textarea
    group: subject
    required: false
    hint:
      ru: >-
        Недостатки, зафиксированные при передаче, показания счётчиков, наличие мебели и оборудования.
    example:
      ru: >-
        Помещение в исправном состоянии, с отделкой, оснащено системой кондиционирования, пожарной сигнализацией и структурированной кабельной сетью. Дефектов, препятствующих использованию, не выявлено.
      kk: >-
        Үй-жай жарамды күйде, әрлеуімен, кондиционерлеу жүйесімен, өрт дабылымен және құрылымдалған кабель желісімен жабдықталған.
  - name: purpose
    label: {ru: 'Цель использования', kk: 'Пайдалану мақсаты', en: 'Permitted use'}
    type: text
    group: subject
    required: true
    hint:
      ru: >-
        Например: под офис, склад, розничную торговлю. Использование не по назначению — основание для расторжения.
    example:
      ru: 'Размещение офиса арендатора'
      kk: 'Жалға алушының кеңсесін орналастыру'
  - name: rent_amount
    label: {ru: 'Арендная плата за месяц', kk: 'Айлық жалдау ақысы', en: 'Monthly rent'}
    type: money
    group: terms
    required: true
    unit: тенге
    hint:
      ru: >-
        Укажите, включает ли плата НДС и коммунальные платежи.
    example:
      ru: '1 250 000'
  - name: payment_day
    label: {ru: 'Срок внесения арендной платы', kk: 'Жалдау ақысын енгізу мерзімі', en: 'Rent payment date'}
    type: text
    group: terms
    required: true
    hint:
      ru: >-
        Например: не позднее 5-го числа оплачиваемого месяца.
    example:
      ru: 'не позднее 5 числа оплачиваемого месяца'
      kk: 'төленетін айдың 5-күнінен кешіктірмей'
  - name: utilities
    label: {ru: 'Коммунальные платежи', kk: 'Коммуналдық төлемдер', en: 'Utilities'}
    type: select
    group: terms
    required: false
    options:
      - {value: included, label: {ru: Включены в арендную плату, kk: Жалдау ақысына кіреді, en: Included in rent}}
      - {value: separate, label: {ru: Оплачиваются арендатором отдельно, kk: Жалға алушы бөлек төлейді, en: Paid separately by lessee}}
      - {value: lessor, label: {ru: Оплачиваются арендодателем, kk: Жалға беруші төлейді, en: Paid by lessor}}
  - name: lease_start
    label: {ru: 'Дата начала аренды', kk: 'Жалдаудың басталу күні', en: 'Lease start date'}
    type: date
    group: terms
    required: true
    example:
      ru: '2026-10-01'
  - name: lease_term
    label: {ru: 'Срок аренды', kk: 'Жалдау мерзімі', en: 'Lease term'}
    type: text
    group: terms
    required: true
    hint:
      ru: >-
        Например: 11 месяцев. Срок один год и более требует государственной регистрации права аренды на недвижимость.
    example:
      ru: '11 месяцев с правом продления'
      kk: '11 ай, ұзарту құқығымен'
  - name: deposit
    label: {ru: 'Обеспечительный (гарантийный) депозит', kk: 'Кепілдік депозиті', en: 'Security deposit'}
    type: money
    group: extra
    required: false
    unit: тенге
    hint:
      ru: >-
        Укажите основания удержания и срок возврата после освобождения помещения.
    example:
      ru: '1 250 000'
  - name: indexation
    label: {ru: 'Порядок изменения арендной платы', kk: 'Жалдау ақысын өзгерту тәртібі', en: 'Rent revision'}
    type: textarea
    group: extra
    required: false
    hint:
      ru: >-
        По ст. 546 ГК РК размер платы может изменяться не чаще одного раза в год, если иное не установлено договором.
    example:
      ru: >-
        Арендная плата пересматривается один раз в год по соглашению сторон, но не более чем на уровень инфляции за предыдущий год по данным Бюро национальной статистики.
      kk: >-
        Жалдау ақысы жылына бір рет тараптардың келісімі бойынша қайта қаралады, бірақ өткен жылғы инфляция деңгейінен аспайды.
  - name: sublease_allowed
    label: {ru: 'Субаренда', kk: 'Қосалқы жалдау', en: 'Sublease'}
    type: select
    group: extra
    required: false
    options:
      - {value: forbidden, label: {ru: Запрещена, kk: Тыйым салынған, en: Prohibited}}
      - {value: consent, label: {ru: С письменного согласия арендодателя, kk: Жалға берушінің жазбаша келісімімен, en: With lessor's written consent}}
      - {value: allowed, label: {ru: Разрешена, kk: Рұқсат етілген, en: Permitted}}
  - name: repairs
    label: {ru: 'Распределение ремонта', kk: 'Жөндеуді бөлу', en: 'Allocation of repairs'}
    type: select
    group: extra
    required: false
    options:
      - {value: standard, label: {ru: 'Капитальный — арендодатель, текущий — арендатор', kk: 'Күрделі — жалға беруші, ағымдағы — жалға алушы', en: 'Capital by lessor, current by lessee'}}
      - {value: lessee_all, label: {ru: Весь ремонт за счёт арендатора, kk: Барлық жөндеу жалға алушы есебінен, en: All repairs by lessee}}
      - {value: lessor_all, label: {ru: Весь ремонт за счёт арендодателя, kk: Барлық жөндеу жалға беруші есебінен, en: All repairs by lessor}}
sections:
  - key: subject
    title: {ru: 'Предмет договора', kk: 'Шарттың мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Индивидуализировать имущество так, чтобы его нельзя было спутать: адрес, кадастровый номер, номер
        помещения и этаж, площадь, для движимого имущества — марка, модель, серийный или заводской номер.
        Указать основание, по которому имущество принадлежит арендодателю (право собственности, доверительное
        управление, право хозяйственного ведения), с реквизитами правоустанавливающего документа. Прямо
        зафиксировать цель использования и заверение об отсутствии обременений и прав третьих лиц. Сослаться
        на ст. 540 и ст. 541 ГК РК: в наём передаются вещи, не теряющие натуральных свойств при использовании.
    refs:
      - {act: ГК РК, article: '540'}
      - {act: ГК РК, article: '541'}
  - key: term
    title: {ru: 'Срок аренды', kk: 'Жалдау мерзімі', en: 'Lease term'}
    guidance:
      ru: >-
        Указать дату начала и окончания аренды либо срок в месяцах. Описать порядок пролонгации: автоматическое
        продление на тот же срок, если ни одна сторона не заявила об отказе за определённое время до окончания.
        Отметить, что при продолжении пользования после истечения срока без возражений арендодателя договор
        считается возобновлённым на неопределённый срок. Если срок один год и более и предметом является
        недвижимость — включить пункт о государственной регистрации: кто подаёт документы, в какой срок и за чей счёт.
    refs:
      - {act: ГК РК, article: '545'}
      - {act: ГК РК, article: '543'}
  - key: rent
    title: {ru: 'Арендная плата и порядок расчётов', kk: 'Жалдау ақысы және есеп айырысу тәртібі', en: 'Rent and payments'}
    guidance:
      ru: >-
        Указать размер платы за месяц цифрами и прописью, включение НДС, срок внесения (конкретное число
        месяца), способ платежа и момент исполнения обязательства. Отдельно определить, входят ли в плату
        коммунальные услуги, интернет, эксплуатационные расходы и налог на имущество, а если нет — порядок их
        возмещения по счетам поставщиков. Описать условия и периодичность изменения размера платы: по ст. 546
        ГК РК плата может пересматриваться не чаще одного раза в год, если договором не установлено иное.
        Описать назначение обеспечительного депозита, основания его удержания и срок возврата.
    refs:
      - {act: ГК РК, article: '546'}
  - key: handover
    title: {ru: 'Порядок передачи и возврата имущества', kk: 'Мүлікті беру және қайтару тәртібі', en: 'Handover and return'}
    guidance:
      ru: >-
        Установить срок передачи имущества и то, что передача оформляется двусторонним актом приёма-передачи с
        описью, фиксацией недостатков, показаний приборов учёта и комплекта ключей. Описать порядок возврата:
        срок освобождения, состояние с учётом нормального износа, вывоз имущества арендатора, судьба
        неотделимых улучшений (компенсируются только при письменном согласии арендодателя) и последствия
        просрочки возврата — плата за фактическое пользование и неустойка.
  - key: lessor_obligations
    title: {ru: 'Права и обязанности арендодателя', kk: 'Жалға берушінің құқықтары мен міндеттері', en: 'Lessor''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: передать имущество в состоянии, пригодном для использования по назначению, со всеми
        принадлежностями и документами; предупредить о правах третьих лиц; производить капитальный ремонт;
        не препятствовать пользованию. Права: проверять состояние имущества с предварительным уведомлением
        (указать срок и разумную периодичность), требовать своевременного внесения платы, требовать
        расторжения при нарушениях. Отразить ответственность за недостатки, о которых арендодатель не сообщил.
    refs:
      - {act: ГК РК, article: '552–554'}
  - key: lessee_obligations
    title: {ru: 'Права и обязанности арендатора', kk: 'Жалға алушының құқықтары мен міндеттері', en: 'Lessee''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: использовать имущество строго по назначению, поддерживать в исправном состоянии, нести
        расходы на содержание и текущий ремонт, соблюдать пожарные и санитарные требования, своевременно
        вносить плату, незамедлительно сообщать об аварии, не производить перепланировку и не сдавать в
        субаренду без письменного согласия. Права: пользоваться имуществом беспрепятственно, требовать
        устранения недостатков или уменьшения платы, преимущественное право на заключение договора на новый срок.
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Установить неустойку за просрочку внесения арендной платы (процент за каждый день с предельным
        размером), ответственность арендатора за повреждение имущества и за просрочку возврата, ответственность
        арендодателя за непредоставление имущества в срок. Определить, кто несёт риск случайной гибели имущества
        и требуется ли страхование. Сослаться на ст. 293 и ст. 359 ГК РК.
    refs:
      - {act: ГК РК, article: '293'}
      - {act: ГК РК, article: '359'}
  - key: termination
    title: {ru: 'Изменение и досрочное расторжение', kk: 'Мерзімінен бұрын өзгерту және бұзу', en: 'Amendment and early termination'}
    guidance:
      ru: >-
        Перечислить основания досрочного расторжения по требованию арендодателя (существенное нарушение условий
        пользования, ухудшение имущества, просрочка платы более двух раз подряд, несогласованная субаренда) и по
        требованию арендатора (непредоставление имущества, наличие препятствующих недостатков, непроведение
        капитального ремонта). Отдельно закрепить право любой стороны на односторонний внесудебный отказ с
        письменным уведомлением за определённый срок (обычно 30–60 дней) и последствия такого отказа для
        депозита. Сослаться на ст. 556 и ст. 557 ГК РК.
    refs:
      - {act: ГК РК, article: '556'}
      - {act: ГК РК, article: '557'}
  - key: force_majeure
    title: {ru: 'Обстоятельства непреодолимой силы', kk: 'Еңсерілмейтін күш жағдайлары', en: 'Force majeure'}
    guidance:
      ru: >-
        Перечислить обстоятельства непреодолимой силы, срок уведомления, подтверждающий документ и право сторон
        расторгнуть договор, если обстоятельства длятся дольше согласованного срока. Отдельно оговорить судьбу
        арендной платы за период, когда пользование имуществом было невозможно.
    refs:
      - {act: ГК РК, article: '359', note: 'п. 2'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Закрепить претензионный порядок со сроком ответа, затем подсудность — суд по месту нахождения
        недвижимого имущества либо по месту нахождения ответчика. Указать применимое право — право
        Республики Казахстан.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Порядок изменения только письменным дополнительным соглашением, число экземпляров, порядок уведомлений
        и адреса для их направления, сохранение договора при смене собственника имущества, перечень приложений.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Полные реквизиты сторон: наименование или ФИО, БИН или ИИН, адрес, банковские реквизиты, телефон,
        электронная почта, ФИО и должность подписанта, основание его полномочий.
essential_terms:
  - key: object
    label: {ru: 'Объект найма: данные, позволяющие определённо установить имущество', kk: 'Жалдау объектісі: мүлікті нақты айқындауға мүмкіндік беретін деректер', en: 'The leased object, definitively identified'}
    fields: [property_description]
    section: subject
    basis: {act: ГК РК, article: '541'}
  - key: rent
    label: {ru: 'Размер арендной платы', kk: 'Жалдау ақысының мөлшері', en: 'Amount of rent'}
    fields: [rent_amount]
    section: rent
    basis: {act: ГК РК, article: '546'}
  - key: term
    label: {ru: 'Срок аренды', kk: 'Жалдау мерзімі', en: 'Lease term'}
    fields: [lease_term, lease_start]
    section: term
    basis: {act: ГК РК, article: '545'}
risks:
  - party: 0
    text:
      ru: >-
        Арендатор перестал платить, но продолжает занимать помещение; выселение возможно только через суд.
    mitigation:
      ru: >-
        Взять обеспечительный депозит в размере одного-двух месяцев, предусмотреть право на односторонний внесудебный отказ при просрочке свыше согласованного срока и право ограничить доступ по акту.
  - party: 0
    text:
      ru: >-
        Имущество возвращено повреждённым, а первоначальное состояние документально не зафиксировано.
    mitigation:
      ru: >-
        Составлять подробный акт приёма-передачи с описью, фотографиями и показаниями счётчиков и повторять его при возврате.
  - party: 0
    text:
      ru: >-
        Арендатор произвёл перепланировку или требует компенсации неотделимых улучшений.
    mitigation:
      ru: >-
        Прямо запретить любые работы без письменного согласия и указать, что несогласованные улучшения не компенсируются.
  - party: 1
    text:
      ru: >-
        Арендодатель не является собственником либо имущество в залоге, и договор оспаривается или прекращается досрочно.
    mitigation:
      ru: >-
        Проверить правоустанавливающие документы и сведения о зарегистрированных обременениях, включить заверения арендодателя и его ответственность за их недостоверность.
  - party: 1
    text:
      ru: >-
        Арендная плата повышается в одностороннем порядке в течение срока аренды.
    mitigation:
      ru: >-
        Зафиксировать плату на весь срок либо ограничить пересмотр одним разом в год и предельным процентом, со ссылкой на ст. 546 ГК РК.
  - party: 1
    text:
      ru: >-
        Договор на срок год и более не зарегистрирован, и при смене собственника новый владелец требует освободить помещение.
    mitigation:
      ru: >-
        Зарегистрировать право аренды в органе юстиции и включить обязанность арендодателя содействовать регистрации.
annexes:
  - key: handover_act
    title: {ru: 'Акт приёма-передачи имущества', kk: 'Мүлікті қабылдау-беру актісі', en: 'Handover act'}
    kind: sections
    default: true
  - key: inventory
    title: {ru: 'Опись имущества и оборудования', kk: 'Мүлік пен жабдық тізбесі', en: 'Inventory'}
    kind: table
    default: true
    columns:
      - {ru: '№', en: 'No.'}
      - {ru: Наименование, kk: Атауы, en: Item}
      - {ru: Количество, kk: Саны, en: Quantity}
      - {ru: Состояние, kk: Жай-күйі, en: Condition}
      - {ru: Оценочная стоимость, kk: Бағалау құны, en: Estimated value}
  - key: payment_schedule
    title: {ru: 'График арендных платежей', kk: 'Жалдау төлемдерінің кестесі', en: 'Rent payment schedule'}
    kind: table
    default: false
    columns:
      - {ru: Период, kk: Кезең, en: Period}
      - {ru: Срок оплаты, kk: Төлем мерзімі, en: Due date}
      - {ru: Сумма, kk: Сомасы, en: Amount}
  - key: floor_plan
    title: {ru: 'План помещения', kk: 'Үй-жайдың жоспары', en: 'Floor plan'}
    kind: sections
    default: false
reviewed: false
