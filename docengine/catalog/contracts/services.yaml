id: services
kind: contract
family: services
name:
  ru: Договор возмездного оказания услуг
  kk: Ақылы қызмет көрсету шарты
  en: Services Agreement
summary:
  ru: Исполнитель обязуется по заданию заказчика оказать услуги (совершить определённые действия или осуществить определённую деятельность), а заказчик — оплатить эти услуги.
  kk: Орындаушы тапсырыс берушінің тапсырмасы бойынша қызмет көрсетуге, ал тапсырыс беруші осы қызметтерді төлеуге міндеттенеді.
  en: The contractor renders services on the client's instructions, and the client pays for them.
form:
  ru: Простая письменная. Нотариальное удостоверение и государственная регистрация не требуются.
  kk: Жай жазбаша нысан.
  en: Simple written form.
caveat:
  ru: >-
    Услуги отличаются от подряда результатом: у услуги нет овеществлённого результата, оплачивается сама
    деятельность, поэтому к отношениям применяется гл. 33 ГК РК, а нормы о подряде (гл. 32) применяются лишь
    субсидиарно по ст. 687 ГК РК. Если предмет фактически предполагает материальный результат (изготовление
    вещи, ремонт, строительство), договор следует квалифицировать как подряд. Договор об оказании услуг с
    физическим лицом не должен воспроизводить признаки трудовых отношений (подчинение правилам внутреннего
    трудового распорядка, фиксированный график, рабочее место), иначе отношения могут быть переквалифицированы
    в трудовые со всеми последствиями по Трудовому кодексу РК. Отдельные виды услуг (медицинские,
    образовательные, аудиторские, оценочные, юридические, туристские) регулируются специальными законами и
    требуют лицензии либо членства в профессиональной палате.
  en: Services differ from works by the absence of a tangible result; a services contract with an individual may be requalified as employment if it reproduces labour-relation features.
legal_basis:
  - {act: ГК РК, article: '683', note: 'договор возмездного оказания услуг, гл. 33'}
  - {act: ГК РК, article: '684', note: 'исполнение договора возмездного оказания услуг'}
  - {act: ГК РК, article: '685', note: 'оплата услуг'}
  - {act: ГК РК, article: '686', note: 'односторонний отказ от исполнения договора'}
  - {act: ГК РК, article: '687', note: 'субсидиарное применение норм о подряде'}
  - {act: ГК РК, article: '393', note: 'существенные условия договора'}
parties:
  - role: {ru: 'Заказчик', kk: 'Тапсырыс беруші', en: 'Client'}
    kinds: [legal, individual, ip]
  - role: {ru: 'Исполнитель', kk: 'Орындаушы', en: 'Service provider'}
    kinds: [legal, individual, ip]
fields:
  - name: service_description
    label: {ru: 'Описание услуг', kk: 'Қызметтердің сипаттамасы', en: 'Description of services'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Конкретный перечень действий: что именно делает исполнитель, с какой периодичностью и в каком объёме.
    example:
      ru: >-
        Разработка и внедрение корпоративного сайта заказчика: проектирование структуры, дизайн, вёрстка, программирование, наполнение и запуск на хостинге заказчика.
      kk: >-
        Тапсырыс берушінің корпоративтік сайтын әзірлеу және енгізу: құрылымын жобалау, дизайн, беттеу, бағдарламалау, толтыру және іске қосу.
  - name: service_scope
    label: {ru: 'Объём услуг', kk: 'Қызметтер көлемі', en: 'Scope of services'}
    type: textarea
    group: subject
    required: false
    hint:
      ru: >-
        Количественные показатели: часы, обращения, публикации, точки обслуживания. Что не входит в услуги — указать отдельно.
    example:
      ru: >-
        До 25 страниц, адаптивная вёрстка, интеграция с системой заявок, три языка интерфейса, обучение двух сотрудников заказчика.
      kk: >-
        25 бетке дейін, бейімделгіш беттеу, өтінімдер жүйесімен интеграция, интерфейстің үш тілі.
  - name: service_result
    label: {ru: 'Требования к результату', kk: 'Нәтижеге қойылатын талаптар', en: 'Result requirements'}
    type: textarea
    group: subject
    required: false
    hint:
      ru: >-
        Критерии, по которым услуга считается оказанной надлежаще, целевые показатели, форма отчёта.
    example:
      ru: >-
        Работающий сайт на домене заказчика, исходный код в репозитории заказчика, руководство администратора.
      kk: >-
        Тапсырыс берушінің доменіндегі жұмыс істейтін сайт, репозиторийдегі бастапқы код, әкімші нұсқаулығы.
  - name: service_cost
    label: {ru: 'Стоимость услуг', kk: 'Қызметтердің құны', en: 'Fee'}
    type: money
    group: terms
    required: true
    unit: тенге
    hint:
      ru: >-
        Общая цена или ставка за единицу (час, месяц, обращение). Указать, включён ли НДС.
    example:
      ru: '3 400 000'
  - name: payment_order
    label: {ru: 'Порядок оплаты', kk: 'Төлем тәртібі', en: 'Payment procedure'}
    type: select
    group: terms
    required: true
    options:
      - {value: prepayment, label: {ru: Предоплата 100%, kk: 100% алдын ала төлем, en: 100% prepayment}}
      - {value: postpayment, label: {ru: Оплата по факту после подписания акта, kk: Акт бойынша төлем, en: Payment after acceptance act}}
      - {value: partial_prepayment, label: {ru: Аванс с окончательным расчётом, kk: Аванс және түпкілікті есеп айырысу, en: Advance plus final settlement}}
      - {value: monthly, label: {ru: Ежемесячно за отчётный период, kk: Ай сайын, en: Monthly}}
    example:
      ru: 'partial_prepayment'
  - name: start_date
    label: {ru: 'Дата начала оказания услуг', kk: 'Қызмет көрсетудің басталу күні', en: 'Start date'}
    type: date
    group: terms
    required: true
    example:
      ru: '2026-10-06'
  - name: service_term
    label: {ru: 'Срок оказания услуг', kk: 'Қызмет көрсету мерзімі', en: 'Service period'}
    type: text
    group: terms
    required: true
    hint:
      ru: >-
        Конечная дата или период. Для абонентских услуг — срок действия договора и порядок продления.
    example:
      ru: '12 недель с даты начала оказания услуг'
      kk: 'Қызмет көрсету басталған күннен бастап 12 апта'
  - name: acceptance_procedure
    label: {ru: 'Порядок приёмки', kk: 'Қабылдау тәртібі', en: 'Acceptance procedure'}
    type: select
    group: terms
    required: true
    options:
      - {value: act, label: {ru: Акт оказанных услуг, kk: Көрсетілген қызметтер актісі, en: Act of services rendered}}
      - {value: report, label: {ru: Отчёт исполнителя с актом, kk: Орындаушының есебі және акт, en: Provider's report with act}}
      - {value: auto, label: {ru: Автоматическая приёмка при отсутствии возражений, kk: Қарсылық болмаған кезде автоматты қабылдау, en: Deemed acceptance absent objections}}
    example:
      ru: 'act'
  - name: acceptance_days
    label: {ru: 'Срок рассмотрения акта заказчиком', kk: 'Актіні қарау мерзімі', en: 'Days to review the act'}
    type: number
    group: terms
    required: false
    unit: рабочих дней
    example:
      ru: '5'
  - name: personal_performance
    label: {ru: 'Личное исполнение и соисполнители', kk: 'Жеке орындау және қосалқы орындаушылар', en: 'Personal performance and subcontractors'}
    type: select
    group: extra
    required: false
    options:
      - {value: personal, label: {ru: Только лично, kk: Тек жеке өзі, en: Personally only}}
      - {value: consent, label: {ru: Соисполнители с письменного согласия заказчика, kk: Тапсырыс берушінің келісімімен, en: Subcontractors with client's consent}}
      - {value: free, label: {ru: Вправе привлекать соисполнителей, kk: Қосалқы орындаушыларды тартуға құқылы, en: May freely subcontract}}
  - name: confidentiality
    label: {ru: 'Режим конфиденциальности', kk: 'Құпиялылық режимі', en: 'Confidentiality'}
    type: textarea
    group: extra
    required: false
  - name: ip_rights
    label: {ru: 'Права на результаты интеллектуальной деятельности', kk: 'Зияткерлік қызмет нәтижелеріне құқықтар', en: 'Intellectual property'}
    type: textarea
    group: extra
    required: false
    hint:
      ru: >-
        Если в ходе оказания услуг создаются тексты, дизайн, код — указать, к кому и в каком объёме переходят исключительные права.
  - name: penalty_rate
    label: {ru: 'Неустойка за нарушение сроков', kk: 'Мерзімді бұзғаны үшін тұрақсыздық айыбы', en: 'Penalty for delay'}
    type: number
    group: extra
    required: false
    unit: '% в день'
    example:
      ru: '0.1'
sections:
  - key: subject
    title: {ru: 'Предмет договора', kk: 'Шарттың мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Описать услуги конкретным перечнем действий, а не общими словами: какие действия совершает исполнитель,
        с какой периодичностью, в каком объёме и в чьих интересах. Прямо указать, что относится к услугам и что
        в них не входит. Сослаться на ст. 683 ГК РК и отметить, что услуга оплачивается как деятельность, а не
        как овеществлённый результат. Если требуется лицензия или разрешение, указать её реквизиты.
    refs:
      - {act: ГК РК, article: '683'}
  - key: scope
    title: {ru: 'Перечень и объём услуг', kk: 'Қызметтердің тізбесі мен көлемі', en: 'Scope of services'}
    guidance:
      ru: >-
        Раскрыть объём в измеримых величинах: количество часов, обращений, объектов, отчётных периодов.
        Определить порядок постановки заданий (заявка, техническое задание, служебная переписка) и срок их
        принятия исполнителем. Указать, что перечень может уточняться приложением или дополнительным
        соглашением, и как это влияет на цену.
  - key: term
    title: {ru: 'Сроки оказания услуг', kk: 'Қызмет көрсету мерзімдері', en: 'Service periods'}
    guidance:
      ru: >-
        Указать дату начала, дату окончания или длительность, промежуточные сроки для этапов. Для абонентского
        обслуживания — отчётный период и срок реакции на обращение. Описать порядок продления и последствия
        просрочки, в том числе право заказчика отказаться от договора при существенной задержке.
  - key: price
    title: {ru: 'Стоимость услуг и порядок оплаты', kk: 'Қызметтердің құны және төлем тәртібі', en: 'Fee and payment'}
    guidance:
      ru: >-
        Указать цену цифрами и прописью, ставку за единицу, включение НДС, порядок возмещения расходов
        исполнителя (командировочные, материалы) и требование подтверждающих документов. Определить срок оплаты
        от подписания акта, реквизиты для платежа и момент исполнения обязательства. Сослаться на ст. 685 ГК РК,
        а также описать оплату при невозможности исполнения по вине заказчика (услуги оплачиваются полностью) и
        по обстоятельствам, за которые ни одна сторона не отвечает (возмещаются фактически понесённые расходы).
    refs:
      - {act: ГК РК, article: '685'}
  - key: acceptance
    title: {ru: 'Порядок сдачи-приёмки услуг', kk: 'Қызметтерді тапсыру-қабылдау тәртібі', en: 'Acceptance of services'}
    guidance:
      ru: >-
        Установить, в какой срок исполнитель направляет акт оказанных услуг и отчёт, в какой срок заказчик его
        подписывает или направляет мотивированный отказ, и что происходит при молчании: если отказ не направлен
        в согласованный срок, услуги считаются принятыми. Описать содержание мотивированного отказа, порядок
        устранения замечаний и повторной сдачи. Указать допустимость обмена документами по электронной почте
        и через электронную цифровую подпись.
  - key: rights_obligations
    title: {ru: 'Права и обязанности сторон', kk: 'Тараптардың құқықтары мен міндеттері', en: 'Rights and obligations'}
    guidance:
      ru: >-
        Обязанности исполнителя: оказывать услуги качественно и в срок, лично либо с привлечением соисполнителей
        на согласованных условиях (ст. 684 ГК РК), информировать о ходе, соблюдать конфиденциальность, передавать
        результаты и документы. Обязанности заказчика: предоставлять информацию, доступы и материалы, назначить
        контактное лицо, своевременно принимать и оплачивать услуги. Права каждой стороны сформулировать зеркально.
    refs:
      - {act: ГК РК, article: '684'}
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Установить неустойку за просрочку оказания услуг и за просрочку оплаты, ограничение размера
        ответственности (например, суммой договора), исключение упущенной выгоды, если стороны так договорились.
        Указать ответственность исполнителя за некачественные услуги: безвозмездное устранение, уменьшение цены,
        возмещение убытков. Сослаться на ст. 293, 353 и 359 ГК РК.
    refs:
      - {act: ГК РК, article: '293'}
      - {act: ГК РК, article: '359'}
  - key: confidentiality
    title: {ru: 'Конфиденциальность и защита данных', kk: 'Құпиялылық және деректерді қорғау', en: 'Confidentiality and data protection'}
    guidance:
      ru: >-
        Определить, какая информация является конфиденциальной, срок действия обязательства, исключения и
        ответственность за разглашение. Если исполнителю передаются персональные данные, указать основание
        обработки, статус сторон и обязанность соблюдать Закон РК «О персональных данных и их защите».
    refs:
      - {act: ГК РК, article: '126'}
  - key: termination
    title: {ru: 'Срок действия и односторонний отказ', kk: 'Қолданылу мерзімі және біржақты бас тарту', en: 'Term and unilateral withdrawal'}
    guidance:
      ru: >-
        Отдельно раскрыть право на односторонний отказ по ст. 686 ГК РК: заказчик вправе отказаться при условии
        оплаты фактически понесённых исполнителем расходов, исполнитель — при условии полного возмещения
        заказчику убытков. Указать срок письменного уведомления об отказе и порядок окончательных взаиморасчётов,
        возврата авансов и передачи незавершённых материалов.
    refs:
      - {act: ГК РК, article: '686'}
  - key: force_majeure
    title: {ru: 'Обстоятельства непреодолимой силы', kk: 'Еңсерілмейтін күш жағдайлары', en: 'Force majeure'}
    guidance:
      ru: >-
        Перечень обстоятельств, срок уведомления, подтверждающий документ компетентного органа, продление сроков
        на период действия обстоятельств и право расторжения при их длительности свыше согласованного срока.
    refs:
      - {act: ГК РК, article: '359', note: 'п. 2'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Претензионный порядок со сроком ответа, затем подсудность конкретному суду или арбитражу. Применимое
        право — право Республики Казахстан.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Порядок изменения договора, число экземпляров, юридическая сила электронной переписки и сканов, адреса
        для уведомлений, запрет уступки прав без согласия другой стороны, перечень приложений.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Полные реквизиты сторон: наименование или ФИО, БИН или ИИН, адрес, банковские реквизиты, контакты,
        ФИО и должность подписанта и основание его полномочий.
essential_terms:
  - key: subject
    label: {ru: 'Предмет: конкретный перечень и содержание услуг', kk: 'Мәні: қызметтердің нақты тізбесі', en: 'Subject: the specific services'}
    fields: [service_description]
    section: subject
    basis: {act: ГК РК, article: '683'}
  - key: price
    label: {ru: 'Стоимость услуг и порядок оплаты', kk: 'Қызметтердің құны және төлем тәртібі', en: 'Fee and payment terms'}
    fields: [service_cost]
    section: price
    basis: {act: ГК РК, article: '685'}
  - key: term
    label: {ru: 'Срок оказания услуг', kk: 'Қызмет көрсету мерзімі', en: 'Service period'}
    fields: [service_term, start_date]
    section: term
    basis: {act: ГК РК, article: '393'}
risks:
  - party: 0
    text:
      ru: >-
        Услуги оказаны формально: акт подписан, а результата, на который рассчитывал заказчик, нет.
    mitigation:
      ru: >-
        Описать измеримые критерии надлежащего оказания и требования к отчёту, привязать окончательный платёж к достижению этих критериев.
  - party: 0
    text:
      ru: >-
        Исполнитель передал работу неизвестным соисполнителям, качество и конфиденциальность не контролируются.
    mitigation:
      ru: >-
        Установить личное исполнение либо привлечение соисполнителей только с письменного согласия, с сохранением ответственности исполнителя за их действия.
  - party: 0
    text:
      ru: >-
        Договор с физическим лицом переквалифицирован в трудовой, доначислены налоги и социальные платежи.
    mitigation:
      ru: >-
        Исключить из текста подчинение внутреннему распорядку, фиксированный график и рабочее место, оплачивать результат, а не отработанное время.
  - party: 1
    text:
      ru: >-
        Заказчик уклоняется от подписания акта и оплаты, ссылаясь на замечания без конкретики.
    mitigation:
      ru: >-
        Предусмотреть срок на мотивированный отказ и правило о том, что при его отсутствии услуги считаются принятыми и подлежат оплате.
  - party: 1
    text:
      ru: >-
        Заказчик отказался от договора, когда основные затраты уже понесены.
    mitigation:
      ru: >-
        Опираясь на ст. 686 ГК РК, закрепить обязанность возместить фактически понесённые расходы и определить порядок их подтверждения, а также взять аванс.
  - party: 1
    text:
      ru: >-
        Заказчик не предоставляет исходные данные и доступы, из-за чего срываются сроки.
    mitigation:
      ru: >-
        Закрепить встречные обязанности заказчика и правило о переносе сроков на период просрочки предоставления информации.
