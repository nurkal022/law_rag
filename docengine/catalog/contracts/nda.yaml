id: nda
kind: contract
family: ip
name:
  ru: Соглашение о неразглашении конфиденциальной информации
  kk: Құпия ақпаратты жария етпеу туралы келісім
  en: Non-Disclosure Agreement
summary:
  ru: >-
    Стороны определяют, какая информация является конфиденциальной, и получающая сторона обязуется не
    разглашать её третьим лицам и использовать только для согласованной цели.
  kk: >-
    Тараптар қандай ақпараттың құпия болып табылатынын айқындайды, ал алушы тарап оны үшінші тұлғаларға
    жарияламауға міндеттенеді.
  en: >-
    The parties define what information is confidential; the receiving party undertakes not to disclose it and
    to use it only for the agreed purpose.
form:
  ru: Простая письменная. Может заключаться как самостоятельное соглашение или как раздел основного договора.
  kk: Жай жазбаша нысан.
  en: Simple written form; may be a standalone agreement or a clause of the main contract.
caveat:
  ru: >-
    В Республике Казахстан нет отдельной главы ГК РК о неразглашении: соглашение опирается на ст. 126 ГК РК о
    служебной и коммерческой тайне и на Закон РК «О коммерческой тайне», а также на общие нормы о свободе
    договора (ст. 380 ГК РК) и о возмещении убытков (ст. 9 и 350 ГК РК). Правовая защита возникает только
    тогда, когда обладатель информации сам ввёл режим коммерческой тайны: утвердил перечень сведений,
    ограничил доступ, ввёл учёт лиц, получивших доступ, и нанёс гриф или иным образом обозначил
    конфиденциальность. Информация, которая по закону не может составлять коммерческую тайну (например,
    сведения из учредительных документов и открытых государственных реестров, сведения о нарушениях
    законодательства), защите не подлежит независимо от условий соглашения. Обработка персональных данных
    требует отдельного основания по Закону РК «О персональных данных и их защите» и не покрывается одним лишь
    соглашением о неразглашении. Штраф за разглашение является неустойкой по ст. 293 ГК РК и может быть
    уменьшен судом по ст. 297 ГК РК как несоразмерный.
  en: >-
    Kazakhstan has no dedicated NDA chapter: the agreement rests on article 126 of the Civil Code and the Law
    on Commercial Secrets, and protection requires an actually implemented trade-secret regime.
legal_basis:
  - {act: ГК РК, article: '126', note: 'служебная и коммерческая тайна'}
  - {act: ГК РК, article: '380', note: 'свобода договора'}
  - {act: ГК РК, article: '9', note: 'защита гражданских прав и возмещение убытков'}
  - {act: ГК РК, article: '293', note: 'неустойка за нарушение обязательства'}
  - {act: Закон РК «О коммерческой тайне», article: '—', note: 'режим коммерческой тайны и его защита'}
  - {act: Закон РК «О персональных данных и их защите», article: '—', note: 'если передаются персональные данные'}
parties:
  - role: {ru: 'Раскрывающая сторона', kk: 'Ақпаратты ашушы тарап', en: 'Disclosing party'}
    kinds: [legal, individual, ip]
  - role: {ru: 'Получающая сторона', kk: 'Ақпаратты алушы тарап', en: 'Receiving party'}
    kinds: [legal, individual, ip]
fields:
  - name: confidential_info_scope
    label: {ru: 'Состав конфиденциальной информации', kk: 'Құпия ақпараттың құрамы', en: 'Scope of confidential information'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Конкретный перечень категорий сведений: технологии, исходный код, финансовые показатели, клиентская
        база, условия сделок, персональные данные сотрудников. Общая формулировка «любая информация» на
        практике плохо защищается.
  - name: nda_purpose
    label: {ru: 'Цель раскрытия информации', kk: 'Ақпаратты ашу мақсаты', en: 'Purpose of disclosure'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Например: оценка возможности заключения договора поставки, выполнение работ по договору №… Использование
        вне этой цели запрещено.
  - name: marking_rule
    label: {ru: 'Порядок обозначения информации как конфиденциальной', kk: 'Ақпаратты құпия деп белгілеу тәртібі', en: 'Marking rule'}
    type: select
    group: subject
    required: false
    options:
      - {value: marked_only, label: {ru: Только помеченная грифом информация, kk: Тек грифпен белгіленген ақпарат, en: Only expressly marked information}}
      - {value: all_by_nature, label: {ru: Любая информация по характеру конфиденциальная, kk: Сипаты бойынша құпия кез келген ақпарат, en: Any information confidential by its nature}}
      - {value: listed, label: {ru: Информация по перечню в приложении, kk: Қосымшадағы тізбе бойынша ақпарат, en: Information listed in the annex}}
  - name: direction
    label: {ru: 'Направленность обязательства', kk: 'Міндеттеменің бағыты', en: 'Direction of the obligation'}
    type: select
    group: terms
    required: false
    options:
      - {value: one_way, label: {ru: Односторонняя (обязана одна сторона), kk: Біржақты, en: One-way}}
      - {value: mutual, label: {ru: Взаимная (обязаны обе стороны), kk: Өзара, en: Mutual}}
  - name: nda_term
    label: {ru: 'Срок действия обязательств о неразглашении', kk: 'Жария етпеу міндеттемелерінің мерзімі', en: 'Term of confidentiality'}
    type: text
    group: terms
    required: true
    hint:
      ru: >-
        Например: в течение срока действия основного договора и 3 (три) года после его прекращения. Бессрочный
        режим для сведений, охраняемых как коммерческая тайна, допустим, пока сохраняется её режим.
  - name: permitted_recipients
    label: {ru: 'Кому допускается раскрытие', kk: 'Ақпаратты кімге ашуға болады', en: 'Permitted recipients'}
    type: textarea
    group: terms
    required: false
    hint:
      ru: >-
        Работники и консультанты, которым информация необходима для цели, при условии принятия ими равнозначных
        обязательств; аффилированные лица; государственные органы по обязательному запросу.
  - name: return_procedure
    label: {ru: 'Порядок возврата и уничтожения информации', kk: 'Ақпаратты қайтару және жою тәртібі', en: 'Return and destruction'}
    type: textarea
    group: extra
    required: false
    hint:
      ru: >-
        Срок возврата носителей и удаления копий после окончания сотрудничества и порядок подтверждения
        уничтожения письменным актом.
  - name: penalty_amount
    label: {ru: 'Штраф за каждое нарушение', kk: 'Әрбір бұзушылық үшін айыппұл', en: 'Penalty per breach'}
    type: money
    group: extra
    required: false
    unit: тенге
    hint:
      ru: >-
        Штраф является неустойкой по ст. 293 ГК РК; несоразмерно высокий размер может быть уменьшен судом по
        ст. 297 ГК РК.
  - name: personal_data
    label: {ru: 'Передаются ли персональные данные', kk: 'Дербес деректер берілетіні', en: 'Personal data involved'}
    type: select
    group: extra
    required: false
    options:
      - {value: 'no', label: {ru: Нет, kk: Жоқ, en: 'No'}}
      - {value: 'yes', label: {ru: Да — требуется отдельное основание обработки, kk: Иә, en: 'Yes'}}
sections:
  - key: subject
    title: {ru: 'Предмет соглашения', kk: 'Келісімнің мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Указать, в связи с чем стороны обмениваются информацией (переговоры, исполнение основного договора с
        реквизитами), является ли обязательство односторонним или взаимным, и что получающая сторона обязуется
        сохранять конфиденциальность и использовать информацию исключительно для указанной цели. Сослаться на
        ст. 126 ГК РК и Закон РК «О коммерческой тайне».
    refs:
      - {act: ГК РК, article: '126'}
  - key: definition
    title: {ru: 'Определение конфиденциальной информации', kk: 'Құпия ақпаратты айқындау', en: 'Definition of confidential information'}
    guidance:
      ru: >-
        Перечислить конкретные категории сведений, а не ограничиваться общей формулировкой: техническая и
        технологическая информация, исходный код, ноу-хау, финансовые и коммерческие показатели, клиентская
        база, условия сделок, планы развития, персональные данные работников. Определить форму передачи
        (документы, электронные файлы, устные сообщения) и правило обозначения: помечается ли информация грифом
        и в какой срок устно переданные сведения подтверждаются письменно. Указать, что режим коммерческой тайны
        введён раскрывающей стороной и подтверждается внутренним перечнем сведений.
  - key: exceptions
    title: {ru: 'Исключения из конфиденциальной информации', kk: 'Құпия ақпараттан алып тасталатындар', en: 'Exclusions'}
    guidance:
      ru: >-
        Перечислить стандартные исключения: информация, ставшая общедоступной не по вине получающей стороны;
        известная ей до раскрытия, что подтверждается документально; полученная от третьего лица правомерно и
        без обязательства конфиденциальности; самостоятельно разработанная без использования полученных
        сведений. Отдельно указать раскрытие по обязательному требованию суда или уполномоченного
        государственного органа с обязанностью незамедлительно уведомить раскрывающую сторону и раскрыть
        минимально необходимый объём. Указать, что сведения, которые по законодательству не могут составлять
        коммерческую тайну, соглашением не защищаются.
  - key: obligations
    title: {ru: 'Обязательства получающей стороны', kk: 'Алушы тараптың міндеттемелері', en: 'Obligations of the receiving party'}
    guidance:
      ru: >-
        Раскрыть конкретные обязанности: не разглашать третьим лицам без письменного согласия, использовать
        только для указанной цели, применять к защите информации меры не ниже применяемых к собственной
        конфиденциальной информации, ограничить доступ кругом лиц, которым она необходима, и обеспечить
        принятие ими равнозначных обязательств, вести учёт лиц, получивших доступ, не копировать сверх
        необходимого, незамедлительно уведомлять раскрывающую сторону о любом факте несанкционированного
        доступа или разглашения. Прямо указать, что получающая сторона отвечает за действия своих работников,
        подрядчиков и аффилированных лиц как за свои собственные.
  - key: rights
    title: {ru: 'Права на информацию и отсутствие лицензии', kk: 'Ақпаратқа құқықтар', en: 'Rights in the information'}
    guidance:
      ru: >-
        Указать, что раскрытие информации не влечёт передачи каких-либо прав на объекты интеллектуальной
        собственности, не создаёт лицензии и не обязывает стороны заключать основной договор. Зафиксировать,
        что вся информация остаётся собственностью раскрывающей стороны, и что информация предоставляется «как
        есть», без гарантий полноты и точности, если стороны так договорились.
  - key: handling
    title: {ru: 'Порядок обращения с информацией', kk: 'Ақпаратпен жұмыс істеу тәртібі', en: 'Handling of information'}
    guidance:
      ru: >-
        Описать организационные и технические меры: хранение на защищённых носителях и в согласованных
        системах, запрет пересылки на личную почту и в публичные мессенджеры и облака, парольная защита и
        шифрование, порядок передачи по электронным каналам, ведение журнала доступа. Если передаются
        персональные данные, указать основание обработки, роли сторон и обязанность соблюдать Закон РК «О
        персональных данных и их защите», включая требования к локализации баз.
  - key: term
    title: {ru: 'Срок действия обязательств', kk: 'Міндеттемелердің қолданылу мерзімі', en: 'Term'}
    guidance:
      ru: >-
        Указать дату вступления в силу, срок действия соглашения и отдельно — срок сохранения
        конфиденциальности после его прекращения (например, три или пять лет), а для сведений, охраняемых как
        коммерческая тайна, — до утраты ими такого статуса. Подчеркнуть, что прекращение основного договора не
        прекращает обязательство о неразглашении.
  - key: return
    title: {ru: 'Возврат и уничтожение информации', kk: 'Ақпаратты қайтару және жою', en: 'Return and destruction'}
    guidance:
      ru: >-
        Установить срок возврата носителей и удаления копий по письменному требованию раскрывающей стороны или
        по окончании цели, порядок подтверждения уничтожения письменным актом, а также разумные исключения:
        архивные копии в системах резервного копирования и копии, хранение которых обязательно по
        законодательству, — при сохранении на них режима конфиденциальности.
  - key: liability
    title: {ru: 'Ответственность за нарушение', kk: 'Бұзғаны үшін жауапкершілік', en: 'Liability for breach'}
    guidance:
      ru: >-
        Установить штраф за каждый факт разглашения и право требовать возмещения убытков сверх штрафа, если
        стороны выбирают штрафную неустойку. Указать право требовать прекращения нарушения и изъятия
        информации у третьих лиц. Оговорить, что разглашение может влечь также административную и уголовную
        ответственность по законодательству Республики Казахстан. Сослаться на ст. 293 ГК РК и ст. 9 и 350 ГК
        РК о возмещении убытков.
    refs:
      - {act: ГК РК, article: '293'}
      - {act: ГК РК, article: '9'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Претензионный порядок со сроком ответа и подсудность конкретному суду или арбитражу; применимое право —
        право Республики Казахстан. Отдельно оговорить право на обеспечительные меры и на обращение в суд без
        соблюдения претензионного порядка при продолжающемся разглашении, если это допускается процессуальным
        законодательством.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Порядок изменения только письменным соглашением, запрет уступки прав без согласия, независимость
        условий (недействительность одного пункта не влечёт недействительности остальных), число экземпляров,
        адреса для уведомлений, соотношение с основным договором при противоречии.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Полные реквизиты сторон: наименование или ФИО, БИН или ИИН, адрес, контакты, адрес электронной почты
        для направления уведомлений, ФИО и должность подписанта и основание полномочий.
essential_terms:
  - key: subject
    label: {ru: 'Состав сведений, признаваемых конфиденциальными', kk: 'Құпия деп танылатын мәліметтердің құрамы', en: 'The information defined as confidential'}
    fields: [confidential_info_scope]
    section: definition
    basis: {act: ГК РК, article: '126'}
  - key: purpose
    label: {ru: 'Цель раскрытия и допустимые пределы использования', kk: 'Ашу мақсаты және пайдалану шектері', en: 'Purpose and permitted use'}
    fields: [nda_purpose]
    section: subject
    basis: {act: ГК РК, article: '380'}
  - key: term
    label: {ru: 'Срок действия обязательства о неразглашении', kk: 'Жария етпеу міндеттемесінің мерзімі', en: 'Term of the confidentiality obligation'}
    fields: [nda_term]
    section: term
    basis: {act: ГК РК, article: '393'}
risks:
  - party: 0
    text:
      ru: >-
        Режим коммерческой тайны фактически не введён: перечня сведений нет, доступ не ограничен, документы не
        помечены, поэтому защита в суде затруднена.
    mitigation:
      ru: >-
        Утвердить внутренний перечень сведений, составляющих коммерческую тайну, ограничить доступ, вести учёт
        допущенных лиц и маркировать носители грифом до передачи.
  - party: 0
    text:
      ru: >-
        Факт разглашения и размер убытков доказать невозможно, а штраф не предусмотрен.
    mitigation:
      ru: >-
        Установить фиксированный штраф за каждый факт разглашения с правом взыскания убытков сверх него и вести
        реестр переданной информации с датами и получателями.
  - party: 0
    text:
      ru: >-
        Информация утекает через работников и подрядчиков получающей стороны, которые соглашение не подписывали.
    mitigation:
      ru: >-
        Прямо возложить на получающую сторону ответственность за действия её работников и привлечённых лиц как
        за собственные и обязать брать с них равнозначные обязательства.
  - party: 1
    text:
      ru: >-
        Конфиденциальной объявлена «любая информация», из-за чего под запрет попадают и общедоступные сведения,
        а риск претензий не ограничен.
    mitigation:
      ru: >-
        Ограничить предмет перечнем категорий и правилом маркировки, включить полный набор стандартных
        исключений.
  - party: 1
    text:
      ru: >-
        Требование о немедленном уничтожении всех копий невыполнимо из-за систем резервного копирования и
        обязательных сроков хранения документов.
    mitigation:
      ru: >-
        Предусмотреть исключение для архивных и обязательных по закону копий с сохранением на них режима
        конфиденциальности.
  - party: 1
    text:
      ru: >-
        Размер штрафа несоразмерен возможному ущербу и применяется за любое формальное нарушение.
    mitigation:
      ru: >-
