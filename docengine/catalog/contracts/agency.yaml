id: agency
kind: contract
family: services
name:
  ru: Агентский договор
  kk: Агенттік шарт
  en: Agency Agreement
summary:
  ru: >-
    Агент обязуется за вознаграждение совершать по поручению принципала юридические и фактические действия от
    имени и за счёт принципала либо от своего имени, но за счёт принципала.
  kk: >-
    Агент сыйақы үшін принципалдың тапсырмасы бойынша заңдық және іс жүзіндегі әрекеттерді принципалдың атынан
    және есебінен не өз атынан, бірақ принципалдың есебінен жасауға міндеттенеді.
  en: >-
    The agent, for a fee, performs legal and factual actions on the principal's instructions, either in the
    principal's name and at the principal's expense or in its own name but at the principal's expense.
form:
  ru: >-
    Простая письменная. Для совершения сделок от имени принципала агенту дополнительно выдаётся доверенность,
    а для сделок, требующих нотариальной формы, — нотариально удостоверенная доверенность.
  kk: Жай жазбаша нысан; принципалдың атынан мәмілелер жасау үшін сенімхат қажет.
  en: Simple written form; acting in the principal's name additionally requires a power of attorney.
caveat:
  ru: >-
    В Гражданском кодексе Республики Казахстан НЕТ отдельной главы об агентском договоре — в отличие от
    Гражданского кодекса Российской Федерации, где ему посвящена глава 52. В казахстанском праве агентский
    договор является непоименованным смешанным договором, допустимым в силу свободы договора (ст. 380 ГК РК) и
    п. 2 ст. 381 ГК РК о смешанном договоре. К отношениям применяются нормы главы 41 ГК РК о поручении, если
    агент действует от имени принципала, и нормы главы 43 ГК РК о комиссии, если агент действует от своего
    имени, но за счёт принципала. Поэтому в договоре нужно ПРЯМО указать, от чьего имени действует агент: от
    этого зависит, кто становится стороной сделок с третьими лицами и какой набор норм применяется. По ст. 852
    ГК РК доверитель вправе отменить поручение, а поверенный — отказаться от него в любое время, и соглашение
    об отказе от этого права ничтожно; аналогичные правила действуют для комиссии, поэтому «безотзывность»
    агентского договора в РК ненадёжна. Отдельные виды посредничества (страховые агенты, платёжные агенты,
    туристские агенты, таможенные представители) регулируются специальными законами и требуют лицензии,
    регистрации или включения в реестр.
  en: >-
    Kazakhstan's Civil Code has NO separate chapter on agency: it is an innominate mixed contract built on the
    mandate rules (chapter 41) and the commission rules (chapter 43); the name in which the agent acts must be
    stated expressly.
legal_basis:
  - {act: ГК РК, article: '380', note: 'свобода договора — основание для непоименованного договора'}
  - {act: ГК РК, article: '381', note: 'смешанный договор, п. 2'}
  - {act: ГК РК, article: '846', note: 'договор поручения, гл. 41 — если агент действует от имени принципала'}
  - {act: ГК РК, article: '847–851', note: 'обязанности поверенного и доверителя, отчёт'}
  - {act: ГК РК, article: '852', note: 'прекращение поручения и недопустимость отказа от права на отмену'}
  - {act: ГК РК, article: '865', note: 'договор комиссии, гл. 43 — если агент действует от своего имени'}
  - {act: ГК РК, article: '869', note: 'комиссионное вознаграждение'}
  - {act: ГК РК, article: '874', note: 'отчёт комиссионера'}
  - {act: ГК РК, article: '167', note: 'доверенность'}
parties:
  - role: {ru: 'Принципал', kk: 'Принципал', en: 'Principal'}
    kinds: [legal, individual, ip]
  - role: {ru: 'Агент', kk: 'Агент', en: 'Agent'}
    kinds: [legal, ip, individual]
fields:
  - name: agency_scope
    label: {ru: 'Предмет поручения и полномочия агента', kk: 'Тапсырманың мәні және агенттің өкілеттіктері', en: 'Scope of the mandate'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Конкретный перечень юридических и фактических действий: поиск покупателей, ведение переговоров,
        заключение договоров, приём платежей, продвижение, участие в тендерах. Полномочия должны быть
        определены точно, иначе сделки агента могут быть оспорены.
    example:
      ru: >-
        Поиск покупателей на продукцию принципала, проведение переговоров, согласование условий поставки и заключение договоров поставки от имени и за счёт принципала.
      kk: >-
        Принципалдың өніміне сатып алушыларды іздеу, келіссөздер жүргізу, жеткізу шарттарын келісу және принципалдың атынан шарттар жасасу.
  - name: acting_capacity
    label: {ru: 'От чьего имени действует агент', kk: 'Агент кімнің атынан әрекет етеді', en: 'Capacity in which the agent acts'}
    type: select
    group: subject
    required: true
    hint:
      ru: >-
        Ключевой выбор: при действиях от имени принципала применяются нормы о поручении (гл. 41 ГК РК) и
        стороной сделки становится принципал; при действиях от своего имени — нормы о комиссии (гл. 43 ГК РК)
        и стороной сделки становится агент.
    options:
      - value: principal_name
        label:
          ru: 'От имени и за счёт принципала (модель поручения)'
          kk: 'Принципалдың атынан және есебінен (тапсырма моделі)'
          en: "In the principal's name and at its expense (mandate model)"
      - value: agent_name
        label:
          ru: 'От своего имени, но за счёт принципала (модель комиссии)'
          kk: 'Өз атынан, бірақ принципалдың есебінен (комиссия моделі)'
          en: "In the agent's own name but at the principal's expense (commission model)"
      - value: mixed
        label:
          ru: 'Смешанно — по видам сделок согласно приложению'
          kk: 'Аралас — қосымшаға сәйкес мәміле түрлері бойынша'
          en: 'Mixed, depending on the type of transaction per the annex'
    example:
      ru: 'principal_name'
  - name: territory
    label: {ru: 'Территория действия договора', kk: 'Шарттың қолданылу аумағы', en: 'Territory'}
    type: text
    group: subject
    required: false
    example:
      ru: 'Алматинская, Жамбылская и Туркестанская области'
      kk: 'Алматы, Жамбыл және Түркістан облыстары'
  - name: exclusivity
    label: {ru: 'Исключительность', kk: 'Айрықшалық', en: 'Exclusivity'}
    type: select
    group: subject
    required: false
    options:
      - {value: non_exclusive, label: {ru: Неисключительный агент, kk: Айрықша емес агент, en: Non-exclusive}}
      - {value: exclusive_territory, label: {ru: Исключительное право на территории, kk: Аумақтағы айрықша құқық, en: Exclusive within the territory}}
      - {value: sole, label: {ru: Единственный агент без ограничения прав принципала, kk: Жалғыз агент, en: Sole agent}}
  - name: agent_fee
    label: {ru: 'Размер вознаграждения агента', kk: 'Агенттің сыйақысының мөлшері', en: 'Agent''s fee'}
    type: text
    group: terms
    required: true
    hint:
      ru: >-
        Фиксированная сумма, процент от суммы сделки или комбинация. Укажите базу расчёта и момент
        возникновения права на вознаграждение.
    example:
      ru: >-
        5 % от суммы каждого договора, заключённого при содействии агента и оплаченного покупателем
      kk: >-
        Агенттің жәрдемімен жасалған және сатып алушы төлеген әрбір шарт сомасының 5 %-ы
  - name: fee_basis
    label: {ru: 'Порядок расчёта и выплаты вознаграждения', kk: 'Сыйақыны есептеу және төлеу тәртібі', en: 'Fee calculation and payment'}
    type: select
    group: terms
    required: false
    options:
      - {value: percent_deal, label: {ru: Процент от суммы заключённой сделки, kk: Мәміле сомасынан пайыз, en: Percentage of the transaction}}
      - {value: percent_paid, label: {ru: Процент от фактически поступивших платежей, kk: Нақты түскен төлемдерден пайыз, en: Percentage of amounts actually received}}
      - {value: fixed, label: {ru: Фиксированная сумма за период, kk: Кезеңге тіркелген сома, en: Fixed amount per period}}
      - {value: retention, label: {ru: Удержание агентом из поступивших сумм, kk: Түскен сомалардан ұстап қалу, en: Withheld by the agent from receipts}}
  - name: expenses
    label: {ru: 'Порядок возмещения расходов агента', kk: 'Агенттің шығыстарын өтеу тәртібі', en: 'Reimbursement of expenses'}
    type: textarea
    group: terms
    required: false
    hint:
      ru: >-
        Какие расходы возмещаются, требуется ли предварительное согласование и подтверждающие документы,
        предусмотрен ли аванс на расходы.
    example:
      ru: >-
        Командировочные и представительские расходы возмещаются принципалом по фактическим документам в пределах 300 000 тенге в месяц.
      kk: >-
        Іссапар және өкілдік шығыстары нақты құжаттар бойынша айына 300 000 теңге шегінде өтеледі.
  - name: reporting_frequency
    label: {ru: 'Периодичность отчётов агента', kk: 'Агент есептерінің кезеңділігі', en: 'Reporting frequency'}
    type: select
    group: terms
    required: true
    options:
      - {value: weekly, label: {ru: Еженедельно, kk: Апта сайын, en: Weekly}}
      - {value: monthly, label: {ru: Ежемесячно, kk: Ай сайын, en: Monthly}}
      - {value: quarterly, label: {ru: Ежеквартально, kk: Тоқсан сайын, en: Quarterly}}
      - {value: on_completion, label: {ru: По завершении каждого поручения, kk: Әрбір тапсырма аяқталғанда, en: On completion of each assignment}}
    example:
      ru: 'monthly'
  - name: agency_start
    label: {ru: 'Дата начала действия договора', kk: 'Шарттың басталу күні', en: 'Start date'}
    type: date
    group: terms
    required: false
    example:
      ru: '2026-10-01'
  - name: agency_term
    label: {ru: 'Срок действия договора', kk: 'Шарттың қолданылу мерзімі', en: 'Term'}
    type: text
    group: terms
    required: true
    example:
      ru: '12 месяцев с автоматической пролонгацией на тот же срок'
      kk: '12 ай, сол мерзімге автоматты түрде ұзартылады'
  - name: subagent
    label: {ru: 'Право привлекать субагентов', kk: 'Қосалқы агенттерді тарту құқығы', en: 'Right to appoint sub-agents'}
    type: select
    group: extra
    required: false
    options:
      - {value: forbidden, label: {ru: Запрещено, kk: Тыйым салынған, en: Prohibited}}
      - {value: consent, label: {ru: С письменного согласия принципала, kk: Принципалдың жазбаша келісімімен, en: With the principal's written consent}}
      - {value: allowed, label: {ru: Разрешено, kk: Рұқсат етілген, en: Permitted}}
  - name: non_compete
    label: {ru: 'Ограничения конкурирующей деятельности', kk: 'Бәсекелес қызметке шектеулер', en: 'Non-compete restrictions'}
    type: textarea
    group: extra
    required: false
    hint:
      ru: >-
        Ограничения должны быть разумными по сроку, территории и предмету; чрезмерные могут противоречить
        законодательству о защите конкуренции.
  - name: power_of_attorney
    label: {ru: 'Реквизиты доверенности', kk: 'Сенімхаттың деректемелері', en: 'Power of attorney details'}
    type: text
    group: extra
    required: false
    example:
      ru: 'Доверенность № 14 от 01.10.2026, срок действия — 12 месяцев'
      kk: '2026 жылғы 01.10 № 14 сенімхат, қолданылу мерзімі — 12 ай'
sections:
  - key: subject
    title: {ru: 'Предмет договора', kk: 'Шарттың мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Указать, что договор является смешанным и заключён на основании ст. 380 и п. 2 ст. 381 ГК РК, поскольку
        отдельной главы об агентском договоре ГК РК не содержит. Прямо и однозначно определить, от чьего имени
        действует агент: от имени и за счёт принципала — тогда применяются нормы главы 41 ГК РК о поручении и
        права и обязанности по сделкам возникают непосредственно у принципала; либо от своего имени, но за счёт
        принципала — тогда применяются нормы главы 43 ГК РК о комиссии и стороной сделки становится агент.
        Описать перечень юридических и фактических действий, территорию и категорию третьих лиц.
    refs:
      - {act: ГК РК, article: '380'}
      - {act: ГК РК, article: '381', note: 'п. 2'}
      - {act: ГК РК, article: '846'}
      - {act: ГК РК, article: '865'}
  - key: powers
    title: {ru: 'Полномочия агента и доверенность', kk: 'Агенттің өкілеттіктері және сенімхат', en: 'Powers and power of attorney'}
    guidance:
      ru: >-
        Перечислить полномочия закрытым списком и отдельно указать действия, требующие предварительного
        письменного согласия принципала: заключение договоров свыше определённой суммы, предоставление скидок,
        отсрочек и рассрочек, приём денежных средств, подписание претензий и мировых соглашений. Если агент
        действует от имени принципала, указать обязанность принципала выдать доверенность, её срок и объём, а
        также порядок её отзыва и возврата. Указать пределы отступления от указаний принципала и обязанность
        уведомить о допущенных отступлениях. Сослаться на ст. 847 и ст. 167 ГК РК.
    refs:
      - {act: ГК РК, article: '847'}
      - {act: ГК РК, article: '167'}
  - key: fee
    title: {ru: 'Вознаграждение агента', kk: 'Агенттің сыйақысы', en: 'Agent''s fee'}
    guidance:
      ru: >-
        Указать размер вознаграждения (фиксированный или в процентах), базу расчёта (сумма заключённой сделки
        или сумма фактически поступивших платежей — выбрать одно, это частый источник споров), момент
        возникновения права на вознаграждение, срок и порядок выплаты, включение НДС. Определить, вправе ли
        агент удерживать вознаграждение из поступивших сумм. Описать судьбу дополнительной выгоды, полученной
        при исполнении на условиях более выгодных, чем указаны принципалом. Сослаться на ст. 869 ГК РК.
    refs:
      - {act: ГК РК, article: '869'}
  - key: expenses
    title: {ru: 'Расходы агента и порядок их возмещения', kk: 'Агенттің шығыстары және оларды өтеу', en: 'Expenses and reimbursement'}
    guidance:
      ru: >-
        Определить, какие расходы агента возмещаются сверх вознаграждения (реклама, командировки, комиссии
        банков, услуги третьих лиц), какие требуют предварительного согласования и какими документами
        подтверждаются. Указать срок представления отчёта о расходах, срок их возмещения и возможность
        авансирования. Сослаться на обязанность доверителя возмещать издержки по ст. 850 ГК РК.
    refs:
      - {act: ГК РК, article: '850'}
  - key: reporting
    title: {ru: 'Порядок исполнения и отчётность', kk: 'Орындау және есеп беру тәртібі', en: 'Performance and reporting'}
    guidance:
      ru: >-
        Установить периодичность и форму отчёта агента с обязательным содержанием: совершённые действия,
        заключённые сделки, поступившие средства, понесённые расходы, приложение подтверждающих документов.
        Указать срок направления отчёта, срок рассмотрения принципалом и срок для мотивированных возражений, а
        также правило о принятии отчёта при отсутствии возражений в этот срок. Отдельно описать обязанность
        агента незамедлительно передавать принципалу всё полученное по сделкам и порядок перечисления денежных
        средств. Сослаться на ст. 849 ГК РК и ст. 874 ГК РК.
    refs:
      - {act: ГК РК, article: '849'}
      - {act: ГК РК, article: '874'}
  - key: principal_obligations
    title: {ru: 'Права и обязанности принципала', kk: 'Принципалдың құқықтары мен міндеттері', en: 'Principal''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: выдать доверенность при действиях от своего имени, предоставить информацию, материалы,
        образцы, прайс-листы и товар, принимать всё исполненное агентом, возмещать издержки и выплачивать
        вознаграждение в срок, не создавать препятствий. Права: давать обязательные указания в пределах
        договора, требовать отчёта и подтверждающих документов, проверять исполнение, отменить поручение.
    refs:
      - {act: ГК РК, article: '850'}
  - key: agent_obligations
    title: {ru: 'Права и обязанности агента', kk: 'Агенттің құқықтары мен міндеттері', en: 'Agent''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: исполнять поручение лично и в соответствии с указаниями принципала на наиболее выгодных
        для него условиях, сообщать по требованию сведения о ходе исполнения, передавать всё полученное,
        возвращать доверенность по прекращении договора, соблюдать конфиденциальность, не действовать в
        интересах конкурентов, если это ограничение согласовано. Права: привлекать субагентов на согласованных
        условиях с сохранением ответственности за их действия, удерживать вознаграждение из поступивших сумм,
        если это предусмотрено, отказаться от исполнения поручения.
    refs:
      - {act: ГК РК, article: '849'}
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Установить ответственность агента за превышение полномочий и за убытки, причинённые отступлением от
        указаний, за несвоевременное перечисление полученных средств, за недостоверность отчёта. Указать, что
        агент по общему правилу не отвечает за неисполнение сделки третьим лицом, если только он не принял на
        себя ручательство (делькредере) за отдельное вознаграждение. Установить ответственность принципала за
        просрочку выплаты вознаграждения и возмещения расходов. Сослаться на ст. 293 и 359 ГК РК.
    refs:
      - {act: ГК РК, article: '293'}
      - {act: ГК РК, article: '359'}
  - key: term_termination
    title: {ru: 'Срок действия и прекращение договора', kk: 'Қолданылу мерзімі және шартты тоқтату', en: 'Term and termination'}
    guidance:
      ru: >-
        Указать срок действия и порядок пролонгации. Отдельно и честно раскрыть право каждой стороны прекратить
        отношения: принципал вправе отменить поручение, а агент — отказаться от него в любое время, при этом
        соглашение об отказе от этого права ничтожно (ст. 852 ГК РК). Установить срок предварительного
        письменного уведомления (например, 30 дней), порядок окончательных расчётов за фактически совершённые
        действия, судьбу сделок, находящихся в процессе заключения, возврат доверенности, материалов и
        нереализованного товара, а также условия выплаты вознаграждения по сделкам, заключённым после
        прекращения договора с найденными агентом контрагентами.
    refs:
      - {act: ГК РК, article: '852'}
  - key: confidentiality
    title: {ru: 'Конфиденциальность и защита данных', kk: 'Құпиялылық және деректерді қорғау', en: 'Confidentiality and data protection'}
    guidance:
      ru: >-
        Определить перечень конфиденциальных сведений (клиентская база, условия сделок, цены), срок сохранения
        конфиденциальности после прекращения договора и ответственность за разглашение. Указать принадлежность
        клиентской базы принципалу и обязанность агента передать её при прекращении договора. При передаче
        персональных данных клиентов указать основание обработки по законодательству о персональных данных.
    refs:
      - {act: ГК РК, article: '126'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Претензионный порядок со сроком ответа, подсудность конкретному суду или арбитражу, применимое право —
        право Республики Казахстан. Указать порядок сверки взаиморасчётов как обязательный этап перед
        предъявлением денежных требований.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Порядок изменения письменным соглашением, антикоррупционная оговорка и запрет действовать способами,
        нарушающими законодательство о противодействии коррупции, юридическая сила электронной переписки,
        адреса для уведомлений, независимость условий, перечень приложений.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Полные реквизиты сторон: наименование или ФИО, БИН или ИИН, адрес, банковские реквизиты, контакты,
        ФИО и должность подписанта и основание полномочий; для агента — реквизиты доверенности, лицензии или
        включения в реестр, если вид посредничества этого требует.
essential_terms:
  - key: subject
    label: {ru: 'Предмет — конкретные действия, порученные агенту', kk: 'Мәні — агентке тапсырылған нақты әрекеттер', en: 'Subject — the specific actions entrusted to the agent'}
    fields: [agency_scope]
    section: subject
    basis: {act: ГК РК, article: '846'}
  - key: capacity
    label: {ru: 'Указание, от чьего имени и за чей счёт действует агент', kk: 'Агент кімнің атынан және есебінен әрекет ететіні', en: 'Whether the agent acts in its own or the principal''s name'}
    fields: [acting_capacity]
    section: subject
    basis: {act: ГК РК, article: '381', note: 'п. 2, смешанный договор'}
  - key: fee
    label: {ru: 'Размер и порядок выплаты вознаграждения', kk: 'Сыйақының мөлшері және төлеу тәртібі', en: 'Amount and payment of the fee'}
    fields: [agent_fee]
    section: fee
    basis: {act: ГК РК, article: '869'}
  - key: term
    label: {ru: 'Срок действия договора', kk: 'Шарттың қолданылу мерзімі', en: 'Term of the agreement'}
    fields: [agency_term]
    section: term_termination
    basis: {act: ГК РК, article: '393'}
risks:
  - party: 0
    text:
      ru: >-
        Агент заключил сделку с превышением полномочий или на невыгодных условиях, и принципал оказался связан
        обязательством перед третьим лицом.
    mitigation:
      ru: >-
        Ограничить полномочия закрытым перечнем и лимитом суммы сделки, выдать доверенность строго в этих
        пределах и требовать предварительного письменного согласования отступлений.
  - party: 0
    text:
      ru: >-
        Агент получил деньги от клиентов и не перечислил их принципалу.
    mitigation:
      ru: >-
        Запретить приём платежей либо установить короткий срок перечисления с неустойкой, требовать отчёт с
        приложением платёжных документов и проводить регулярную сверку.
  - party: 0
    text:
      ru: >-
        Агент увёл клиентскую базу и начал работать с теми же клиентами напрямую или в интересах конкурента.
    mitigation:
      ru: >-
        Закрепить принадлежность клиентской базы принципалу, обязанность её передачи и разумное по сроку и
        территории ограничение конкурирующей деятельности с ответственностью за нарушение.
  - party: 1
    text:
      ru: >-
        Принципал отменил поручение после того, как агент нашёл клиента, и заключил сделку напрямую, лишив
        агента вознаграждения.
    mitigation:
      ru: >-
        Предусмотреть вознаграждение по сделкам с контрагентами, привлечёнными агентом, заключённым в течение
        определённого периода после прекращения договора, и порядок фиксации привлечённых клиентов.
  - party: 1
    text:
      ru: >-
        База расчёта вознаграждения размыта, и принципал оспаривает сумму, ссылаясь на неоплату со стороны
        клиента.
    mitigation:
      ru: >-
        Однозначно определить базу и момент возникновения права на вознаграждение и приложить форму расчёта к
        договору.
  - party: 1
    text:
      ru: >-
        Договор объявлен безотзывным, но по ст. 852 ГК РК такое условие ничтожно, и принципал в любой момент
        прекращает отношения.
    mitigation:
      ru: >-
        Не полагаться на безотзывность: установить срок уведомления о прекращении и компенсацию фактически
        понесённых расходов и незакрытых сделок.
