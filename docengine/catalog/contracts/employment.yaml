risks:
  - party: 0
    text:
      ru: >-
        Трудовая функция описана общими словами, из-за чего невозможно доказать неисполнение обязанностей при
        дисциплинарном взыскании или увольнении.
    mitigation:
      ru: >-
        Утвердить должностную инструкцию приложением к договору и вручить её работнику под роспись; фиксировать
        поручения и результаты письменно.
  - party: 0
    text:
      ru: >-
        Срочный договор заключён без основания из ст. 30 ТК РК и при споре признаётся заключённым на
        неопределённый срок, а увольнение по истечении срока — незаконным.
    mitigation:
      ru: >-
        Прямо назвать в договоре основание срочности и подтверждающие обстоятельства либо заключать договор на
        неопределённый срок.
  - party: 0
    text:
      ru: >-
        Работник разгласил коммерческую тайну или клиентскую базу, но режим её защиты у работодателя не введён.
    mitigation:
      ru: >-
        Утвердить перечень сведений, составляющих коммерческую тайну, ознакомить работника под роспись и
        включить в договор обязанность неразглашения со ссылкой на ст. 126 ГК РК.
  - party: 1
    text:
      ru: >-
        Фактическая заработная плата выше указанной в договоре: неофициальная часть не подтверждается при споре,
        отпускных и пособий по ней не начисляют.
    mitigation:
      ru: >-
        Требовать указания полного размера оклада и всех надбавок в договоре и в приказе о приёме на работу.
  - party: 1
    text:
      ru: >-
        В договор включены условия хуже предусмотренных законом: отпуск менее 24 дней, штрафы, удержания за
        увольнение по собственному желанию.
    mitigation:
      ru: >-
        Такие условия недействительны по ст. 10 ТК РК; при подписании требовать их исключения и сохранить свой
        экземпляр договора.
  - party: 1
    text:
      ru: >-
        Работа во вредных условиях без соответствующих гарантий, компенсаций и средств защиты, поскольку условия
        труда в договоре не охарактеризованы.
    mitigation:
      ru: >-
        Требовать включения характеристики условий труда по результатам аттестации производственных объектов и
        перечня положенных компенсаций.
