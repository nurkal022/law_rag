id: employment
kind: contract
family: labour
name:
  ru: Трудовой договор
  kk: Еңбек шарты
  en: Employment Contract
summary:
  ru: >-
    Работодатель обязуется предоставить работнику работу по определённой трудовой функции, обеспечить условия
    труда и своевременно выплачивать заработную плату, а работник — лично выполнять эту работу и соблюдать
    трудовой распорядок.
  kk: >-
    Жұмыс беруші жұмыскерге белгілі бір еңбек функциясы бойынша жұмыс беруге және еңбекақыны уақтылы төлеуге,
    ал жұмыскер осы жұмысты жеке өзі орындауға міндеттенеді.
  en: >-
    The employer provides work under a defined job function, ensures working conditions and pays wages on time;
    the employee personally performs the work and observes internal labour rules.
form:
  ru: >-
    Письменная, не менее чем в двух экземплярах, по одному для каждой стороны; экземпляр работника вручается под
    роспись. Регулируется Трудовым кодексом РК, а не Гражданским кодексом.
  kk: Жазбаша нысан, кемінде екі данада.
  en: Written form, at least two counterparts, one handed to the employee against signature.
caveat:
  ru: >-
    Трудовой договор регулируется Трудовым кодексом РК, а не Гражданским кодексом: нормы ГК РК о свободе
    договора к нему применяются ограниченно. Условия, ухудшающие положение работника по сравнению с трудовым
    законодательством, недействительны, даже если работник их подписал (ст. 10 ТК РК). Перечень обязательных
    условий закреплён ст. 28 ТК РК и его нельзя сократить соглашением сторон. Срочный трудовой договор может
    заключаться только по основаниям, прямо перечисленным в ст. 30 ТК РК; при отсутствии такого основания
    договор считается заключённым на неопределённый срок. Испытательный срок не может превышать трёх месяцев
    (для руководителей и их заместителей, главных бухгалтеров — шести) и не устанавливается для отдельных
    категорий работников (ст. 36 ТК РК). Для отдельных категорий (иностранные работники, руководители
    госорганизаций, надомники, вахтовики, домашние работники) действуют дополнительные правила.
  en: >-
    Employment is governed by the Labour Code, not the Civil Code; mandatory terms are set by article 28 and
    cannot be reduced by agreement.
legal_basis:
  - {act: ТК РК, article: '28', note: 'обязательные условия трудового договора'}
  - {act: ТК РК, article: '30', note: 'срок трудового договора'}
  - {act: ТК РК, article: '31–33', note: 'заключение, форма договора и документы для приёма на работу'}
  - {act: ТК РК, article: '36', note: 'условие об испытательном сроке'}
  - {act: ТК РК, article: '49–52', note: 'основания прекращения трудового договора'}
  - {act: ТК РК, article: '77–82', note: 'рабочее время и режим работы'}
  - {act: ТК РК, article: '88', note: 'ежегодный основной оплачиваемый трудовой отпуск'}
  - {act: ТК РК, article: '113', note: 'порядок и сроки выплаты заработной платы'}
  - {act: ТК РК, article: '10', note: 'недействительность условий, ухудшающих положение работника'}
parties:
  - role: {ru: 'Работодатель', kk: 'Жұмыс беруші', en: 'Employer'}
    kinds: [legal, ip]
  - role: {ru: 'Работник', kk: 'Жұмыскер', en: 'Employee'}
    kinds: [individual]
fields:
  - name: position
    label: {ru: 'Должность', kk: 'Лауазымы', en: 'Position'}
    type: text
    group: subject
    required: true
    hint:
      ru: >-
        Наименование должности, специальности, профессии с указанием квалификации в соответствии с
        Квалификационным справочником должностей и Национальным классификатором занятий.
  - name: structural_unit
    label: {ru: 'Структурное подразделение', kk: 'Құрылымдық бөлімше', en: 'Structural unit'}
    type: text
    group: subject
    required: false
  - name: job_function
    label: {ru: 'Трудовая функция (основные обязанности)', kk: 'Еңбек функциясы', en: 'Job function'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Краткое описание работы по должности либо прямая отсылка к должностной инструкции, которая является
        приложением к договору и вручается работнику под роспись.
  - name: workplace
    label: {ru: 'Место выполнения работы', kk: 'Жұмысты орындау орны', en: 'Place of work'}
    type: text
    group: subject
    required: true
    hint:
      ru: >-
        Адрес места работы или указание на дистанционный либо разъездной характер работы. Это обязательное
        условие по ст. 28 ТК РК.
  - name: contract_term_type
    label: {ru: 'Вид договора по сроку', kk: 'Мерзімі бойынша шарт түрі', en: 'Term type'}
    type: select
    group: terms
    required: true
    options:
      - {value: indefinite, label: {ru: На неопределённый срок, kk: Белгіленбеген мерзімге, en: Indefinite term}}
      - {value: fixed, label: {ru: На определённый срок (не менее одного года), kk: Белгілі бір мерзімге, en: Fixed term}}
      - {value: task, label: {ru: На время выполнения определённой работы, kk: Белгілі бір жұмысты орындау уақытына, en: For a specific task}}
      - {value: substitute, label: {ru: На время замещения отсутствующего работника, kk: Уақытша болмаған жұмыскерді алмастыру уақытына, en: To replace an absent employee}}
      - {value: seasonal, label: {ru: На время сезонной работы, kk: Маусымдық жұмыс уақытына, en: Seasonal work}}
  - name: start_date
    label: {ru: 'Дата начала работы', kk: 'Жұмыстың басталу күні', en: 'Start date'}
    type: date
    group: terms
    required: true
  - name: end_date
    label: {ru: 'Дата окончания срочного договора', kk: 'Мерзімді шарттың аяқталу күні', en: 'End date of fixed-term contract'}
    type: date
    group: terms
    required: false
  - name: probation
    label: {ru: 'Испытательный срок', kk: 'Сынақ мерзімі', en: 'Probation'}
    type: select
    group: terms
    required: false
    options:
      - {value: none, label: {ru: Без испытательного срока, kk: Сынақ мерзімісіз, en: No probation}}
      - {value: '1month', label: {ru: 1 месяц, kk: 1 ай, en: 1 month}}
      - {value: '2months', label: {ru: 2 месяца, kk: 2 ай, en: 2 months}}
      - {value: '3months', label: {ru: 3 месяца, kk: 3 ай, en: 3 months}}
  - name: salary
    label: {ru: 'Должностной оклад (тарифная ставка)', kk: 'Лауазымдық жалақы', en: 'Salary'}
    type: money
    group: terms
    required: true
    unit: тенге в месяц
    hint:
      ru: >-
        Оклад до удержания налогов и обязательных платежей, не ниже минимального размера заработной платы,
        установленного на соответствующий финансовый год.
  - name: salary_dates
    label: {ru: 'Сроки выплаты заработной платы', kk: 'Еңбекақы төлеу мерзімдері', en: 'Wage payment dates'}
    type: text
    group: terms
    required: true
    hint:
      ru: >-
        По ст. 113 ТК РК заработная плата выплачивается не реже одного раза в месяц, не позднее первой декады
        следующего месяца; укажите конкретное число.
  - name: allowances
    label: {ru: 'Доплаты, надбавки и премии', kk: 'Қосымша ақылар мен сыйлықақылар', en: 'Allowances and bonuses'}
    type: textarea
    group: terms
    required: false
  - name: work_schedule
    label: {ru: 'Режим рабочего времени', kk: 'Жұмыс уақытының режимі', en: 'Working time regime'}
    type: select
    group: terms
    required: true
    options:
      - {value: standard, label: {ru: Пятидневная рабочая неделя (40 часов), kk: Бес күндік жұмыс аптасы, en: Five-day week (40 hours)}}
      - {value: shift, label: {ru: Сменный режим, kk: Ауысымдық режим, en: Shift work}}
      - {value: flexible, label: {ru: Гибкий режим, kk: Икемді режим, en: Flexible hours}}
      - {value: remote, label: {ru: Дистанционная работа, kk: Қашықтықтан жұмыс, en: Remote work}}
      - {value: parttime, label: {ru: Неполное рабочее время, kk: Толық емес жұмыс уақыты, en: Part-time}}
  - name: weekly_hours
    label: {ru: 'Продолжительность рабочей недели', kk: 'Жұмыс аптасының ұзақтығы', en: 'Weekly hours'}
    type: number
    group: terms
    required: false
    unit: часов
  - name: vacation_days
    label: {ru: 'Оплачиваемый ежегодный трудовой отпуск', kk: 'Ақы төленетін жыл сайынғы еңбек демалысы', en: 'Paid annual leave'}
    type: number
    group: terms
    required: true
    unit: календарных дней
    hint:
      ru: >-
        Не менее 24 календарных дней (ст. 88 ТК РК); для отдельных категорий и вредных условий труда
        предусмотрены дополнительные дни.
  - name: work_conditions
    label: {ru: 'Характеристика условий труда', kk: 'Еңбек жағдайларының сипаттамасы', en: 'Working conditions'}
    type: textarea
    group: extra
    required: true
    hint:
      ru: >-
        Обязательное условие по ст. 28 ТК РК: степень вредности и опасности, наличие тяжёлых физических работ,
        компенсации и льготы за работу во вредных условиях, средства индивидуальной защиты.
  - name: liability_terms
    label: {ru: 'Материальная ответственность и обучение', kk: 'Материалдық жауапкершілік', en: 'Material liability and training'}
    type: textarea
    group: extra
    required: false
    hint:
      ru: >-
        Условие о полной материальной ответственности заключается отдельным договором; здесь можно указать
        порядок возмещения затрат на обучение при досрочном увольнении.
sections:
  - key: subject
    title: {ru: 'Предмет договора и трудовая функция', kk: 'Шарттың мәні және еңбек функциясы', en: 'Subject and job function'}
    guidance:
      ru: >-
        Указать должность (специальность, профессию, квалификацию) точно по штатному расписанию и
        Квалификационному справочнику, структурное подразделение и краткое содержание трудовой функции либо
        отсылку к должностной инструкции, вручаемой работнику под роспись. Зафиксировать, что работа является
        основной или по совместительству. Сослаться на подпункты ст. 28 ТК РК о работе по определённой
        специальности и месте выполнения работы.
    refs:
      - {act: ТК РК, article: '28'}
  - key: term
    title: {ru: 'Срок трудового договора', kk: 'Еңбек шартының мерзімі', en: 'Term of the contract'}
    guidance:
      ru: >-
        Указать вид договора по сроку и дату начала работы. Для срочного договора обязательно назвать
        основание из ст. 30 ТК РК и дату окончания либо событие, с которым связано прекращение; напомнить, что
        срочный договор на определённый срок заключается не менее чем на один год, кроме прямо названных в
        законе случаев, а при продолжении работы после истечения срока договор считается заключённым на
        неопределённый срок.
    refs:
      - {act: ТК РК, article: '30'}
  - key: probation
    title: {ru: 'Испытательный срок', kk: 'Сынақ мерзімі', en: 'Probation'}
    guidance:
      ru: >-
        Если испытание устанавливается, указать его продолжительность (не более трёх месяцев, для руководителей
        организации, их заместителей и главных бухгалтеров — не более шести) и то, что оно входит в срок
        трудового договора. Описать порядок расторжения по отрицательному результату испытания: письменное
        уведомление с указанием причин до истечения срока испытания. Указать категории, которым испытание не
        устанавливается по ст. 36 ТК РК.
    refs:
      - {act: ТК РК, article: '36'}
  - key: work_conditions
    title: {ru: 'Условия труда и рабочее место', kk: 'Еңбек жағдайлары және жұмыс орны', en: 'Working conditions and workplace'}
    guidance:
      ru: >-
        Описать место выполнения работы (адрес, объект, дистанционный или разъездной характер), характеристику
        условий труда, степень вредности и опасности, гарантии и компенсации за работу во вредных и опасных
        условиях, обеспечение спецодеждой и средствами индивидуальной защиты, обязанность работодателя провести
        инструктаж и обучение по безопасности и охране труда. Это обязательные условия по ст. 28 ТК РК.
    refs:
      - {act: ТК РК, article: '28'}
  - key: working_time
    title: {ru: 'Режим рабочего времени и времени отдыха', kk: 'Жұмыс және демалыс уақытының режимі', en: 'Working time and rest'}
    guidance:
      ru: >-
        Указать продолжительность рабочей недели (нормальная — не более 40 часов), рабочие и выходные дни,
        время начала и окончания работы, перерыв для отдыха и приёма пищи, порядок суммированного учёта при
        сменном режиме. Описать порядок привлечения к сверхурочной работе и работе в выходные и праздничные
        дни и их оплату в повышенном размере. Указать продолжительность ежегодного оплачиваемого трудового
        отпуска (не менее 24 календарных дней) и порядок его предоставления по графику.
    refs:
      - {act: ТК РК, article: '77–82'}
      - {act: ТК РК, article: '88'}
  - key: payment
    title: {ru: 'Оплата труда', kk: 'Еңбекақы төлеу', en: 'Remuneration'}
    guidance:
      ru: >-
        Указать размер должностного оклада или тарифной ставки цифрами и прописью (не ниже установленного
        минимального размера заработной платы), доплаты, надбавки и порядок премирования со ссылкой на
        внутренний акт. Установить конкретные дни выплаты: заработная плата выплачивается не реже одного раза
        в месяц и не позднее первой декады следующего месяца, при задержке работодатель выплачивает пеню.
        Указать, что из заработной платы удерживаются индивидуальный подоходный налог и обязательные
        пенсионные взносы, а также способ выплаты — на банковский счёт работника.
    refs:
      - {act: ТК РК, article: '113'}
  - key: employer_rights
    title: {ru: 'Права и обязанности работодателя', kk: 'Жұмыс берушінің құқықтары мен міндеттері', en: 'Employer''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: предоставить работу по трудовой функции, обеспечить безопасные условия труда и средства
        для работы, выплачивать заработную плату в срок, предоставлять отпуска, осуществлять обязательное
        социальное страхование и пенсионные взносы, ознакомить с актами работодателя под роспись, выдать
        экземпляр договора. Права: требовать исполнения трудовых обязанностей, поощрять, привлекать к
        дисциплинарной и материальной ответственности, издавать обязательные для исполнения акты.
  - key: employee_rights
    title: {ru: 'Права и обязанности работника', kk: 'Жұмыскердің құқықтары мен міндеттері', en: 'Employee''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: добросовестно выполнять трудовую функцию и должностную инструкцию, соблюдать правила
        внутреннего трудового распорядка, трудовую дисциплину и требования безопасности, бережно относиться к
        имуществу работодателя, не разглашать служебную и коммерческую тайну, сообщать о несчастных случаях.
        Права: на условия труда, отвечающие требованиям безопасности, на своевременную и в полном объёме
        оплату труда, на отдых, на возмещение вреда, на обращение за разрешением трудового спора.
  - key: social
    title: {ru: 'Гарантии, компенсации и социальное страхование', kk: 'Кепілдіктер және әлеуметтік сақтандыру', en: 'Guarantees and social insurance'}
    guidance:
      ru: >-
        Указать обязательное социальное страхование, обязательное социальное медицинское страхование,
        обязательные пенсионные взносы, страхование ответственности работодателя за причинение вреда жизни и
        здоровью работника при исполнении трудовых обязанностей. Перечислить компенсации при командировках,
        при разъездном характере работы и иные социальные выплаты, установленные у работодателя.
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Описать дисциплинарную ответственность работника (замечание, выговор, строгий выговор, расторжение
        договора) и порядок её применения с обязательным истребованием письменного объяснения. Описать
        материальную ответственность обеих сторон: работник возмещает прямой действительный ущерб, полная
        материальная ответственность возникает только в случаях, установленных законом или отдельным письменным
        договором. Указать ответственность работодателя за задержку выплаты заработной платы.
  - key: termination
    title: {ru: 'Основания и порядок прекращения договора', kk: 'Шартты тоқтату негіздері мен тәртібі', en: 'Termination'}
    guidance:
      ru: >-
        Перечислить основания прекращения по ст. 49 ТК РК: соглашение сторон, истечение срока, расторжение по
        инициативе работодателя по основаниям ст. 52, расторжение по инициативе работника, обстоятельства, не
        зависящие от воли сторон. Указать срок письменного уведомления работником о расторжении по собственной
        инициативе (не менее одного месяца, если стороны не договорились о меньшем сроке), порядок расчёта при
        увольнении и выдачи документов в последний рабочий день, случаи выплаты компенсации за неиспользованный
        отпуск и выходного пособия.
    refs:
      - {act: ТК РК, article: '49–52'}
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Указать, что изменения и дополнения оформляются письменным дополнительным соглашением, что договор
        составлен в двух экземплярах равной силы и один вручён работнику под роспись, порядок разрешения
        индивидуальных трудовых споров (согласительная комиссия, затем суд), а также что условия, ухудшающие
        положение работника по сравнению с трудовым законодательством, являются недействительными.
    refs:
      - {act: ТК РК, article: '10'}
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Работодатель: наименование, БИН, юридический адрес, банковские реквизиты, ФИО и должность подписанта и
        основание полномочий. Работник: ФИО полностью, ИИН, номер и дата документа, удостоверяющего личность,
        адрес места жительства, номер социального индивидуального кода при наличии. Отметка о получении
        работником своего экземпляра договора с датой и подписью.
