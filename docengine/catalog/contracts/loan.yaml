id: loan
kind: contract
family: finance
name:
  ru: Договор займа
  kk: Қарыз шарты
  en: Loan Agreement
summary:
  ru: >-
    Займодатель передаёт в собственность заёмщику деньги или вещи, определённые родовыми признаками, а заёмщик
    обязуется своевременно возвратить такую же сумму денег или равное количество вещей того же рода и качества.
  kk: >-
    Қарыз беруші қарыз алушының меншігіне ақшаны немесе тектік белгілерімен айқындалған заттарды береді, ал
    қарыз алушы сол мөлшердегі соманы уақтылы қайтаруға міндеттенеді.
  en: >-
    The lender transfers money or fungible items into the borrower's ownership; the borrower returns the same
    amount or an equal quantity of the same kind and quality.
form:
  ru: >-
    Письменная. Договор займа считается заключённым с момента передачи предмета займа, если иное не
    предусмотрено договором.
  kk: Жазбаша нысан.
  en: Written form; the loan is generally deemed concluded upon transfer of the subject of the loan.
caveat:
  ru: >-
    Систематическое предоставление займов под вознаграждение является лицензируемой либо учётно-регистрируемой
    деятельностью: банковский заём вправе выдавать только банк или организация, осуществляющая отдельные виды
    банковских операций (ст. 727 ГК РК), микрокредиты — микрофинансовые организации по Закону РК «О
    микрофинансовой деятельности». Для займов между юридическими лицами и с участием потребителей действуют
    ограничения предельной ставки вознаграждения и требования по годовой эффективной ставке. Заём в
    иностранной валюте между резидентами РК ограничен валютным законодательством: расчёты на территории
    Казахстана производятся в тенге. Если заём беспроцентный, это нужно указать прямо: иначе на сумму займа
    могут начисляться проценты по правилам ст. 718 ГК РК. Валютная оговорка и залог требуют отдельного
    оформления: договор залога недвижимости подлежит государственной регистрации.
  en: >-
    Lending as a business is licensed in Kazakhstan; interest-free must be stated expressly; foreign-currency
    settlement between residents is restricted.
legal_basis:
  - {act: ГК РК, article: '715', note: 'договор займа, гл. 36'}
  - {act: ГК РК, article: '716', note: 'форма договора займа'}
  - {act: ГК РК, article: '717', note: 'момент заключения договора займа'}
  - {act: ГК РК, article: '718', note: 'вознаграждение по договору займа'}
  - {act: ГК РК, article: '722', note: 'возврат предмета займа'}
  - {act: ГК РК, article: '727', note: 'договор банковского займа'}
  - {act: ГК РК, article: '353', note: 'ответственность за неправомерное пользование чужими деньгами'}
parties:
  - role: {ru: 'Займодатель', kk: 'Қарыз беруші', en: 'Lender'}
    kinds: [legal, individual, ip]
  - role: {ru: 'Заёмщик', kk: 'Қарыз алушы', en: 'Borrower'}
    kinds: [legal, individual, ip]
fields:
  - name: loan_amount
    label: {ru: 'Сумма займа', kk: 'Қарыз сомасы', en: 'Loan amount'}
    type: money
    group: subject
    required: true
    unit: тенге
    hint:
      ru: >-
        Сумма цифрами и прописью. Для займа вещами вместо суммы указывается наименование, количество и качество
        вещей, определённых родовыми признаками.
  - name: loan_purpose
    label: {ru: 'Целевое назначение займа', kk: 'Қарыздың мақсаты', en: 'Purpose of the loan'}
    type: text
    group: subject
    required: false
    hint:
      ru: >-
        Если заём целевой, займодатель вправе контролировать использование средств и требовать досрочного
        возврата при нецелевом использовании.
  - name: interest_rate
    label: {ru: 'Ставка вознаграждения', kk: 'Сыйақы мөлшерлемесі', en: 'Interest rate'}
    type: number
    group: terms
    required: true
    unit: '% годовых'
    hint:
      ru: >-
        Укажите 0 для беспроцентного займа и отдельно оговорите беспроцентность в тексте, иначе применяются
        правила ст. 718 ГК РК.
  - name: interest_calculation
    label: {ru: 'Порядок начисления вознаграждения', kk: 'Сыйақыны есептеу тәртібі', en: 'Interest calculation'}
    type: textarea
    group: terms
    required: false
    hint:
      ru: >-
        База начисления (365 или 360 дней), на остаток основного долга или на первоначальную сумму, срок уплаты
        вознаграждения.
  - name: transfer_date
    label: {ru: 'Дата предоставления займа', kk: 'Қарызды беру күні', en: 'Disbursement date'}
    type: date
    group: terms
    required: true
  - name: transfer_method
    label: {ru: 'Способ предоставления займа', kk: 'Қарызды беру тәсілі', en: 'Method of disbursement'}
    type: select
    group: terms
    required: false
    options:
      - {value: bank, label: {ru: Перечислением на банковский счёт, kk: Банк шотына аудару арқылы, en: Bank transfer}}
      - {value: cash, label: {ru: Наличными с распиской, kk: Қолма-қол қолхатпен, en: Cash against receipt}}
      - {value: in_kind, label: {ru: Передачей вещей по акту, kk: Заттарды акт бойынша беру, en: Transfer of goods under an act}}
  - name: return_date
    label: {ru: 'Срок возврата займа', kk: 'Қарызды қайтару мерзімі', en: 'Repayment date'}
    type: date
    group: terms
    required: true
  - name: repayment_schedule
    label: {ru: 'Порядок погашения', kk: 'Өтеу тәртібі', en: 'Repayment schedule'}
    type: select
    group: terms
    required: true
    options:
      - {value: lump_sum, label: {ru: Единовременно в конце срока, kk: Мерзім соңында бір жолғы, en: Lump sum at maturity}}
      - {value: monthly, label: {ru: Ежемесячно равными долями, kk: Ай сайын тең үлестермен, en: Monthly equal instalments}}
      - {value: annuity, label: {ru: Аннуитетными платежами, kk: Аннуитеттік төлемдермен, en: Annuity payments}}
      - {value: quarterly, label: {ru: Ежеквартально, kk: Тоқсан сайын, en: Quarterly}}
  - name: early_repayment
    label: {ru: 'Досрочное погашение', kk: 'Мерзімінен бұрын өтеу', en: 'Early repayment'}
    type: select
    group: extra
    required: false
    options:
      - {value: free, label: {ru: Допускается без ограничений, kk: Шектеусіз рұқсат етіледі, en: Allowed without restriction}}
      - {value: notice, label: {ru: С предварительным уведомлением, kk: Алдын ала хабарлаумен, en: With prior notice}}
      - {value: consent, label: {ru: С согласия займодателя, kk: Қарыз берушінің келісімімен, en: With lender's consent}}
  - name: collateral
    label: {ru: 'Обеспечение исполнения обязательства', kk: 'Міндеттеменің орындалуын қамтамасыз ету', en: 'Security'}
    type: textarea
    group: extra
    required: false
    hint:
      ru: >-
        Залог с описанием предмета и оценкой, поручительство, гарантия, неустойка. Залог недвижимости
        оформляется отдельным договором и регистрируется.
  - name: penalty_rate
    label: {ru: 'Неустойка за просрочку возврата', kk: 'Қайтаруды кешіктіргені үшін тұрақсыздық айыбы', en: 'Penalty for late repayment'}
    type: number
    group: extra
    required: false
    unit: '% в день'
sections:
  - key: subject
    title: {ru: 'Предмет договора', kk: 'Шарттың мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Указать сумму займа цифрами и прописью и валюту, а для займа вещами — наименование, количество, род и
        качество передаваемых вещей. Зафиксировать целевое или нецелевое назначение займа. Сослаться на ст. 715
        ГК РК и указать, что предмет займа передаётся в собственность заёмщика, а возврату подлежит такая же
        сумма денег или равное количество вещей того же рода и качества.
    refs:
      - {act: ГК РК, article: '715'}
  - key: disbursement
    title: {ru: 'Порядок предоставления займа', kk: 'Қарызды беру тәртібі', en: 'Disbursement'}
    guidance:
      ru: >-
        Указать срок и способ передачи предмета займа (перечисление на счёт, наличные под расписку, передача
        вещей по акту) и документ, подтверждающий передачу. Прямо определить момент, с которого договор
        считается заключённым и обязательство исполненным: по ст. 717 ГК РК договор займа считается заключённым
        с момента передачи денег или вещей, если иное не предусмотрено договором. Указать право заёмщика
        отказаться от получения займа до его передачи.
    refs:
      - {act: ГК РК, article: '717'}
  - key: interest
    title: {ru: 'Вознаграждение за пользование займом', kk: 'Қарызды пайдаланғаны үшін сыйақы', en: 'Interest'}
    guidance:
      ru: >-
        Указать ставку вознаграждения в процентах годовых, базу начисления (на остаток основного долга либо на
        первоначальную сумму, из расчёта 365 дней в году), период начисления и срок уплаты. Если заём
        беспроцентный, написать об этом прямо отдельным пунктом. Отдельно определить очерёдность погашения
        требований: издержки по взысканию, вознаграждение, основной долг, неустойка, — и указать, что
        одностороннее изменение ставки не допускается.
    refs:
      - {act: ГК РК, article: '718'}
  - key: repayment
    title: {ru: 'Порядок и сроки возврата', kk: 'Қайтару тәртібі мен мерзімдері', en: 'Repayment'}
    guidance:
      ru: >-
        Указать конечный срок возврата и график платежей (приложение), способ возврата и момент, когда
        обязательство считается исполненным (зачисление на счёт займодателя). Описать условия досрочного
        погашения: допускается ли, требуется ли уведомление и в какой срок, взимается ли комиссия. Указать
        основания досрочного истребования займа займодателем: нецелевое использование, утрата обеспечения,
        просрочка платежа свыше согласованного срока. Сослаться на ст. 722 ГК РК.
    refs:
      - {act: ГК РК, article: '722'}
  - key: security
    title: {ru: 'Обеспечение исполнения обязательств', kk: 'Міндеттемелердің орындалуын қамтамасыз ету', en: 'Security'}
    guidance:
      ru: >-
        Описать вид обеспечения: залог с индивидуализацией предмета и его оценкой, поручительство, банковская
        гарантия. Указать, что залог оформляется отдельным договором, а залог недвижимости подлежит
        государственной регистрации, а также обязанность заёмщика поддерживать обеспечение и не отчуждать
        заложенное имущество без согласия займодателя. Если обеспечение не предоставляется, указать это прямо.
  - key: rights_obligations
    title: {ru: 'Права и обязанности сторон', kk: 'Тараптардың құқықтары мен міндеттері', en: 'Rights and obligations'}
    guidance:
      ru: >-
        Обязанности займодателя: передать предмет займа в срок, принимать исполнение, по требованию заёмщика
        выдавать справку о задолженности и после полного погашения — документ об отсутствии претензий.
        Обязанности заёмщика: использовать заём по назначению, возвращать в согласованные сроки, уведомлять об
        изменении реквизитов и о существенном ухудшении финансового состояния, предоставлять доступ к
        подтверждению целевого использования.
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Установить неустойку за просрочку возврата основного долга и вознаграждения в процентах за каждый день
        просрочки с указанием предельного размера, а также порядок её соотношения с убытками. Сослаться на
        ст. 353 ГК РК о процентах за неправомерное пользование чужими деньгами и ст. 293 ГК РК о неустойке.
        Указать право займодателя обратить взыскание на предмет залога при просрочке.
    refs:
      - {act: ГК РК, article: '353'}
      - {act: ГК РК, article: '293'}
  - key: force_majeure
    title: {ru: 'Обстоятельства непреодолимой силы', kk: 'Еңсерілмейтін күш жағдайлары', en: 'Force majeure'}
    guidance:
      ru: >-
        Перечень обстоятельств, срок уведомления и подтверждающий документ. Отдельно оговорить, что отсутствие
        денежных средств у заёмщика не является обстоятельством непреодолимой силы и не освобождает от возврата.
    refs:
      - {act: ГК РК, article: '359', note: 'п. 2'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Претензионный порядок со сроком ответа, затем подсудность конкретному суду по месту нахождения
        ответчика или займодателя. Указать применимое право — право Республики Казахстан. При займе с
        нотариально удостоверенной сделкой можно предусмотреть взыскание по исполнительной надписи нотариуса.
  - key: term
    title: {ru: 'Срок действия договора', kk: 'Шарттың қолданылу мерзімі', en: 'Term of the agreement'}
    guidance:
      ru: >-
        Указать дату вступления в силу и то, что договор действует до полного исполнения обязательств, включая
        уплату вознаграждения и неустойки. Отметить, что истечение срока возврата не прекращает обязательство.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Порядок изменения только письменным соглашением, число экземпляров, порядок уведомлений и адреса,
        условия уступки права требования третьим лицам и уведомления заёмщика, перечень приложений.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Полные реквизиты сторон: наименование или ФИО, БИН или ИИН, адрес, банковские реквизиты, контакты,
        ФИО и должность подписанта и основание полномочий.
essential_terms:
  - key: subject
    label: {ru: 'Предмет займа и его сумма или количество', kk: 'Қарыз мәні және оның сомасы', en: 'Subject of the loan and its amount'}
    fields: [loan_amount]
    section: subject
    basis: {act: ГК РК, article: '715'}
  - key: return
    label: {ru: 'Обязанность и срок возврата предмета займа', kk: 'Қарызды қайтару міндеті және мерзімі', en: 'Obligation and term of repayment'}
    fields: [return_date, repayment_schedule]
    section: repayment
    basis: {act: ГК РК, article: '722'}
  - key: interest
    label: {ru: 'Размер вознаграждения или указание на беспроцентность', kk: 'Сыйақы мөлшері немесе пайызсыздық', en: 'Interest rate or express interest-free status'}
    fields: [interest_rate]
    section: interest
    basis: {act: ГК РК, article: '718'}
risks:
  - party: 0
    text:
      ru: >-
        Заём выдан наличными без расписки или платёжного документа, и заёмщик отрицает факт получения денег.
    mitigation:
      ru: >-
        Перечислять заём безналичным путём с указанием назначения платежа либо оформлять расписку заёмщика о
        получении, прилагаемую к договору.
  - party: 0
    text:
      ru: >-
        Заёмщик не возвращает заём, а обеспечения нет, и взыскание оказывается бесперспективным.
    mitigation:
      ru: >-
        Взять залог с регистрацией или поручительство платёжеспособного лица, предусмотреть право досрочного
        истребования при первой просрочке.
  - party: 0
    text:
      ru: >-
        Беспроцентность прямо не указана, а вознаграждение не согласовано, из-за чего размер требования спорен.
    mitigation:
      ru: >-
        Прямо указать ставку или беспроцентность и порядок начисления, приложить график платежей.
  - party: 1
    text:
      ru: >-
        Ставка вознаграждения или комиссии изменяются займодателем в одностороннем порядке.
    mitigation:
      ru: >-
        Включить запрет одностороннего изменения ставки и закрытый перечень платежей по договору.
  - party: 1
    text:
      ru: >-
        Неустойка начисляется одновременно с процентами и достигает размера, кратного сумме займа.
    mitigation:
      ru: >-
        Ограничить совокупный размер неустойки процентом от суммы займа и предусмотреть право суда уменьшить её
        по ст. 297 ГК РК.
  - party: 1
    text:
      ru: >-
        Досрочное погашение запрещено или обременено комиссией, и заёмщик переплачивает вознаграждение.
    mitigation:
      ru: >-
        Прямо закрепить право на досрочное погашение без штрафов с пересчётом вознаграждения на фактический
        срок пользования.
annexes:
  - key: payment_schedule
    title: {ru: 'График погашения займа', kk: 'Қарызды өтеу кестесі', en: 'Repayment schedule'}
    kind: table
    default: true
    columns:
      - {ru: '№', en: 'No.'}
      - {ru: Дата платежа, kk: Төлем күні, en: Payment date}
      - {ru: Основной долг, kk: Негізгі борыш, en: Principal}
      - {ru: Вознаграждение, kk: Сыйақы, en: Interest}
      - {ru: Итого к уплате, kk: Барлығы төлеуге, en: Total due}
      - {ru: Остаток долга, kk: Борыш қалдығы, en: Outstanding balance}
  - key: receipt
    title: {ru: 'Расписка о получении предмета займа', kk: 'Қарыз мәнін алу туралы қолхат', en: 'Receipt for the loan'}
    kind: sections
    default: true
  - key: pledge
    title: {ru: 'Договор залога (обеспечение)', kk: 'Кепіл шарты', en: 'Pledge agreement'}
    kind: sections
    default: false
reviewed: false
