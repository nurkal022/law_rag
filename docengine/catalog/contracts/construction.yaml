id: construction
kind: contract
family: works
name:
  ru: Договор подряда (строительного подряда)
  kk: Мердігерлік шарты
  en: Works Contract
summary:
  ru: >-
    Подрядчик обязуется выполнить по заданию заказчика определённую работу и сдать её результат в
    установленный срок, а заказчик — принять результат работы и оплатить его.
  kk: >-
    Мердігер тапсырыс берушінің тапсырмасы бойынша белгілі бір жұмысты орындауға және оның нәтижесін
    белгіленген мерзімде тапсыруға, ал тапсырыс беруші нәтижені қабылдап, оны төлеуге міндеттенеді.
  en: >-
    The contractor performs the works on the client's instructions and hands over the result by the agreed
    deadline; the client accepts and pays for the result.
form:
  ru: >-
    Простая письменная. Для строительно-монтажных работ дополнительно требуются проектная документация,
    разрешительные документы и лицензия либо аттестат на соответствующий вид работ.
  kk: Жай жазбаша нысан.
  en: Simple written form; construction works additionally require design documentation and permits.
caveat:
  ru: >-
    Подряд отличается от возмездных услуг наличием овеществлённого результата, передаваемого заказчику
    (гл. 32 ГК РК); от трудового договора — самостоятельностью подрядчика и оплатой результата, а не процесса.
    Строительный подряд регулируется отдельным параграфом главы 32 ГК РК (ст. 651 и последующие) и
    дополнительно законодательством об архитектурной, градостроительной и строительной деятельности:
    для многих видов строительно-монтажных работ требуется лицензия или аттестат, а объект должен строиться
    по утверждённой проектной документации с прохождением экспертизы, авторского и технического надзора и
    приёмки объекта в эксплуатацию. Существенным для подряда является условие о сроках начала и окончания
    работ: без них договор может быть признан незаключённым.
  en: >-
    Works differ from services by a tangible result; construction works are additionally regulated by
    architectural and construction legislation and often require a licence or attestation.
legal_basis:
  - {act: ГК РК, article: '616', note: 'договор подряда, гл. 32'}
  - {act: ГК РК, article: '620', note: 'сроки выполнения работы'}
  - {act: ГК РК, article: '621', note: 'цена работы и смета'}
  - {act: ГК РК, article: '623', note: 'выполнение работы иждивением подрядчика'}
  - {act: ГК РК, article: '630–635', note: 'сдача и приёмка работы, качество, гарантия'}
  - {act: ГК РК, article: '651', note: 'договор строительного подряда'}
  - {act: ГК РК, article: '393', note: 'существенные условия договора'}
parties:
  - role: {ru: 'Заказчик', kk: 'Тапсырыс беруші', en: 'Client'}
    kinds: [legal, individual, ip]
  - role: {ru: 'Подрядчик', kk: 'Мердігер', en: 'Contractor'}
    kinds: [legal, ip]
fields:
  - name: work_description
    label: {ru: 'Описание работ', kk: 'Жұмыстардың сипаттамасы', en: 'Description of works'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Виды и объёмы работ, наименование и адрес объекта, ссылка на проектную документацию и техническое
        задание, которые являются приложениями к договору.
  - name: object_address
    label: {ru: 'Объект и его адрес', kk: 'Объект және оның мекенжайы', en: 'Site and address'}
    type: text
    group: subject
    required: true
  - name: project_docs
    label: {ru: 'Проектно-сметная документация', kk: 'Жобалау-сметалық құжаттама', en: 'Design and cost documentation'}
    type: textarea
    group: subject
    required: false
    hint:
      ru: >-
        Реквизиты проекта, заключения экспертизы, кто и в какой срок передаёт документацию подрядчику.
  - name: work_cost
    label: {ru: 'Стоимость работ', kk: 'Жұмыстардың құны', en: 'Contract price'}
    type: money
    group: terms
    required: true
    unit: тенге
    hint:
      ru: >-
        Твёрдая или приблизительная цена, включение НДС. Приблизительная цена требует согласования порядка её
        превышения.
  - name: price_type
    label: {ru: 'Вид цены', kk: 'Баға түрі', en: 'Type of price'}
    type: select
    group: terms
    required: false
    options:
      - {value: fixed, label: {ru: Твёрдая цена (смета не пересматривается), kk: Тұрақты баға, en: Fixed price}}
      - {value: approximate, label: {ru: Приблизительная цена по смете, kk: Болжамды баға, en: Approximate price}}
      - {value: unit_rates, label: {ru: По единичным расценкам за фактические объёмы, kk: Бірлік бағалар бойынша, en: Unit rates}}
  - name: start_date
    label: {ru: 'Срок начала работ', kk: 'Жұмыстардың басталу мерзімі', en: 'Commencement date'}
    type: date
    group: terms
    required: true
  - name: end_date
    label: {ru: 'Срок окончания работ', kk: 'Жұмыстардың аяқталу мерзімі', en: 'Completion date'}
    type: date
    group: terms
    required: true
  - name: milestones
    label: {ru: 'Промежуточные этапы и сроки', kk: 'Аралық кезеңдер мен мерзімдер', en: 'Milestones'}
    type: textarea
    group: terms
    required: false
  - name: payment_order
    label: {ru: 'Порядок оплаты', kk: 'Төлем тәртібі', en: 'Payment procedure'}
    type: select
    group: terms
    required: true
    options:
      - {value: advance, label: {ru: Аванс с окончательным расчётом после приёмки, kk: Аванс және түпкілікті есеп айырысу, en: Advance plus final payment}}
      - {value: stages, label: {ru: Поэтапно по актам выполненных работ, kk: Кезең-кезеңімен актілер бойынша, en: By stages against completion acts}}
      - {value: postpayment, label: {ru: Полная оплата после сдачи результата, kk: Нәтижені тапсырғаннан кейін толық төлем, en: Full payment after handover}}
  - name: retention
    label: {ru: 'Гарантийное удержание', kk: 'Кепілдік ұстап қалу', en: 'Retention'}
    type: number
    group: extra
    required: false
    unit: '% от стоимости'
    hint:
      ru: >-
        Часть цены, удерживаемая до истечения гарантийного срока или устранения замечаний; укажите условия
        возврата.
  - name: materials_provider
    label: {ru: 'Кто предоставляет материалы', kk: 'Материалдарды кім береді', en: 'Who supplies materials'}
    type: select
    group: extra
    required: true
    options:
      - {value: contractor, label: {ru: Подрядчик (иждивением подрядчика), kk: Мердігер, en: Contractor}}
      - {value: client, label: {ru: Заказчик (давальческие материалы), kk: Тапсырыс беруші, en: Client}}
      - {value: both, label: {ru: Совместно по перечню, kk: Бірлесіп, en: Both parties}}
  - name: warranty_period
    label: {ru: 'Гарантийный срок на результат работ', kk: 'Жұмыс нәтижесіне кепілдік мерзімі', en: 'Warranty period'}
    type: text
    group: extra
    required: false
  - name: subcontractors
    label: {ru: 'Привлечение субподрядчиков', kk: 'Қосалқы мердігерлерді тарту', en: 'Subcontracting'}
    type: select
    group: extra
    required: false
    options:
      - {value: forbidden, label: {ru: Запрещено, kk: Тыйым салынған, en: Prohibited}}
      - {value: consent, label: {ru: С письменного согласия заказчика, kk: Тапсырыс берушінің жазбаша келісімімен, en: With client's written consent}}
      - {value: allowed, label: {ru: Разрешено, kk: Рұқсат етілген, en: Permitted}}
  - name: penalty_rate
    label: {ru: 'Неустойка за нарушение сроков', kk: 'Мерзімді бұзғаны үшін тұрақсыздық айыбы', en: 'Penalty for delay'}
    type: number
    group: extra
    required: false
    unit: '% в день'
sections:
  - key: subject
    title: {ru: 'Предмет договора', kk: 'Шарттың мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Определить виды и объёмы работ, наименование и адрес объекта, ссылку на техническое задание и
        проектно-сметную документацию как неотъемлемые приложения. Указать, что результатом является
        завершённый и пригодный к использованию объект или его этап, передаваемый заказчику по акту. Отразить
        наличие у подрядчика лицензии или аттестата на соответствующие виды работ с реквизитами. Сослаться на
        ст. 616 и ст. 651 ГК РК.
    refs:
      - {act: ГК РК, article: '616'}
      - {act: ГК РК, article: '651'}
  - key: term
    title: {ru: 'Сроки выполнения работ', kk: 'Жұмыстарды орындау мерзімдері', en: 'Time for completion'}
    guidance:
      ru: >-
        Прямо указать дату начала и дату окончания работ — это существенное условие подряда по ст. 620 ГК РК, а
        также промежуточные сроки по этапам согласно календарному графику (приложение). Определить порядок
        продления сроков при задержке передачи площадки, документации или давальческих материалов заказчиком,
        при приостановке работ по предписанию уполномоченного органа и при неблагоприятных погодных условиях,
        если стороны считают это основанием. Указать порядок оформления такого продления письменным актом или
        дополнительным соглашением.
    refs:
      - {act: ГК РК, article: '620'}
  - key: price
    title: {ru: 'Стоимость работ и порядок оплаты', kk: 'Жұмыстардың құны және төлем тәртібі', en: 'Price and payment'}
    guidance:
      ru: >-
        Указать цену цифрами и прописью, вид цены (твёрдая либо приблизительная по смете), включение НДС и то,
        что цена включает вознаграждение подрядчика и компенсацию его издержек. Описать порядок изменения цены:
        при твёрдой цене подрядчик не вправе требовать её увеличения, кроме существенного возрастания стоимости
        материалов и услуг, которое нельзя было предвидеть; при приблизительной — обязанность своевременно
        предупредить заказчика о необходимости превышения сметы и право заказчика отказаться от договора.
        Указать размер аванса, порядок поэтапных платежей по актам, срок оплаты, гарантийное удержание и
        условия его возврата. Сослаться на ст. 621 ГК РК.
    refs:
      - {act: ГК РК, article: '621'}
  - key: performance
    title: {ru: 'Порядок выполнения работ', kk: 'Жұмыстарды орындау тәртібі', en: 'Performance of works'}
    guidance:
      ru: >-
        Описать передачу строительной площадки или объекта по акту, обеспечение доступа, подключение к
        энергоресурсам и распределение расходов на них. Указать обязанность подрядчика вести журнал производства
        работ и исполнительную документацию, соблюдать требования безопасности, охраны труда, пожарной
        безопасности и охраны окружающей среды, обеспечивать охрану объекта и вывоз строительного мусора.
        Определить право заказчика осуществлять технический надзор без вмешательства в оперативную деятельность
        подрядчика и порядок привлечения субподрядчиков с сохранением ответственности генерального подрядчика
        за их работу.
  - key: materials
    title: {ru: 'Материалы и оборудование', kk: 'Материалдар мен жабдықтар', en: 'Materials and equipment'}
    guidance:
      ru: >-
        Указать, чьим иждивением выполняются работы (ст. 623 ГК РК): кто поставляет материалы, оборудование и
        механизмы. Для давальческих материалов заказчика описать порядок передачи по накладной, учёт, отчёт об
        израсходовании и возврат остатков. Установить обязанность подрядчика проверять качество предоставленных
        материалов и предупреждать заказчика об их непригодности, а также требования к сертификатам и паспортам
        качества применяемых материалов. Определить, кто несёт риск случайной гибели материалов и результата
        работ до приёмки.
    refs:
      - {act: ГК РК, article: '623'}
  - key: acceptance
    title: {ru: 'Сдача и приёмка работ', kk: 'Жұмыстарды тапсыру және қабылдау', en: 'Handover and acceptance'}
    guidance:
      ru: >-
        Описать порядок сдачи: уведомление подрядчика о готовности, срок организации приёмки заказчиком,
        подписание акта выполненных работ и справки о стоимости, срок на мотивированный отказ и правило о
        приёмке при отсутствии отказа в этот срок. Отдельно описать приёмку скрытых работ с составлением актов
        освидетельствования до их закрытия и последствия закрытия скрытых работ без уведомления заказчика.
        Указать передачу исполнительной документации и, для объектов строительства, порядок приёмки объекта в
        эксплуатацию в соответствии с законодательством об архитектурной и строительной деятельности.
    refs:
      - {act: ГК РК, article: '630–632'}
  - key: quality
    title: {ru: 'Качество работ и гарантии', kk: 'Жұмыс сапасы және кепілдіктер', en: 'Quality and warranty'}
    guidance:
      ru: >-
        Установить требования к качеству: соответствие проектной документации, строительным нормам и правилам,
        техническим регламентам. Указать гарантийный срок на результат работ и порядок его исчисления с даты
        подписания акта, обязанность подрядчика безвозмездно устранять недостатки, выявленные в гарантийный
        срок, срок явки для составления акта и срок устранения, а также право заказчика устранить недостатки
        силами третьих лиц за счёт подрядчика при уклонении. Перечислить права заказчика при выявлении
        недостатков по ст. 635 ГК РК.
    refs:
      - {act: ГК РК, article: '633–635'}
  - key: client_obligations
    title: {ru: 'Права и обязанности заказчика', kk: 'Тапсырыс берушінің құқықтары мен міндеттері', en: 'Client''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: передать площадку и документацию в срок, обеспечить доступ и подключения, назначить
        представителя технического надзора, своевременно принимать и оплачивать работы, согласовывать изменения.
        Права: проверять ход и качество работ в любое время, требовать устранения нарушений, отказаться от
        договора при явном отставании от графика, приостановить оплату при выявленных недостатках.
  - key: contractor_obligations
    title: {ru: 'Права и обязанности подрядчика', kk: 'Мердігердің құқықтары мен міндеттері', en: 'Contractor''s rights and obligations'}
    guidance:
      ru: >-
        Обязанности: выполнить работы в объёме и в сроки, обеспечить качество и безопасность, предупредить
        заказчика об обстоятельствах, угрожающих годности результата, и приостановить работы до получения
        указаний, устранять недостатки, сдать объект и передать документацию. Права: требовать своевременной
        оплаты, приостановить работы при непредоставлении заказчиком встречного исполнения, удерживать результат
        работ до оплаты, если это предусмотрено договором.
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Установить неустойку за нарушение сроков начала, промежуточных и конечного сроков, за просрочку оплаты,
        за нарушение требований безопасности, с указанием предельного размера. Определить ответственность
        подрядчика за причинение вреда третьим лицам и за сохранность материалов и результата до приёмки,
        требование о страховании строительно-монтажных рисков и гражданско-правовой ответственности, если
        стороны его вводят. Сослаться на ст. 293 и 359 ГК РК.
    refs:
      - {act: ГК РК, article: '293'}
      - {act: ГК РК, article: '359'}
  - key: force_majeure
    title: {ru: 'Обстоятельства непреодолимой силы', kk: 'Еңсерілмейтін күш жағдайлары', en: 'Force majeure'}
    guidance:
      ru: >-
        Перечень обстоятельств, срок уведомления, подтверждающий документ, порядок консервации объекта и
        распределения расходов на консервацию, продление сроков и право расторжения при длительном действии
        обстоятельств.
    refs:
      - {act: ГК РК, article: '359', note: 'п. 2'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Претензионный порядок со сроком ответа, порядок назначения независимой строительно-технической
        экспертизы и распределения её расходов, затем подсудность конкретному суду или арбитражу. Применимое
        право — право Республики Казахстан.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Порядок изменения договора и оформления дополнительных работ отдельным соглашением до их выполнения,
        порядок расторжения и расчётов за фактически выполненный объём, статус приложений, порядок уведомлений,
        перечень приложений.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Полные реквизиты сторон: наименование, БИН, адрес, банковские реквизиты, реквизиты лицензии или
        аттестата подрядчика, контакты, ФИО и должность подписанта и основание полномочий.
essential_terms:
  - key: subject
    label: {ru: 'Предмет — содержание и объём работ и их результат', kk: 'Мәні — жұмыстардың мазмұны мен көлемі', en: 'Subject — content and scope of works'}
    fields: [work_description, object_address]
    section: subject
    basis: {act: ГК РК, article: '616'}
  - key: start_date
