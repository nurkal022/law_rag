risks:
  - party: 0
    text:
      ru: >-
        Подрядчик получил аванс и не приступил к работам либо бросил объект на середине.
    mitigation:
      ru: >-
        Ограничить аванс, привязать платежи к подписанным актам по этапам, предусмотреть банковскую гарантию
        возврата аванса и право одностороннего отказа с возвратом неотработанной суммы.
  - party: 0
    text:
      ru: >-
        Фактический объём и качество работ не соответствуют актам, а скрытые работы уже закрыты.
    mitigation:
      ru: >-
        Ввести обязательное освидетельствование скрытых работ до их закрытия, технический надзор и право
        привлечь независимую экспертизу за счёт подрядчика при подтверждении нарушений.
  - party: 0
    text:
      ru: >-
        Стоимость работ выросла из-за дополнительных работ, выполненных без письменного согласования.
    mitigation:
      ru: >-
        Установить твёрдую цену и правило, что дополнительные работы без подписанного дополнительного
        соглашения не оплачиваются.
  - party: 1
    text:
      ru: >-
        Заказчик уклоняется от приёмки и подписания акта, из-за чего оплата откладывается.
    mitigation:
      ru: >-
        Предусмотреть срок на мотивированный отказ и правило о приёмке работ при его отсутствии, а также право
        составить односторонний акт.
  - party: 1
    text:
      ru: >-
        Площадка, проектная документация или давальческие материалы переданы с задержкой, но срок сдачи
        остался прежним.
    mitigation:
      ru: >-
        Закрепить встречные обязанности заказчика и автоматический перенос сроков на период просрочки с
        фиксацией актом.
  - party: 1
    text:
      ru: >-
        Заказчик удерживает гарантийную сумму бессрочно, ссылаясь на неустранённые замечания.
    mitigation:
      ru: >-
        Определить размер удержания, закрытый перечень оснований и конкретный срок возврата с процентами за
        просрочку.
