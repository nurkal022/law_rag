id: supply
kind: contract
family: sale
name:
  ru: Договор поставки
  kk: Жеткізу шарты
  en: Supply Agreement
summary:
  ru: >-
    Поставщик-предприниматель обязуется в обусловленные сроки передавать покупателю производимые или
    закупаемые товары для использования в предпринимательской деятельности, а покупатель — принимать и
    оплачивать их.
  kk: >-
    Жеткізуші-кәсіпкер келісілген мерзімде сатып алушыға тауарларды беруге, ал сатып алушы оларды қабылдап,
    төлеуге міндеттенеді.
  en: >-
    The supplier, acting as an entrepreneur, delivers goods within agreed periods for use in business
    activity, and the buyer accepts and pays for them.
form:
  ru: Простая письменная. Нотариальное удостоверение и государственная регистрация не требуются.
  kk: Жай жазбаша нысан.
  en: Simple written form.
caveat:
  ru: >-
    Поставка — не самостоятельный тип договора, а вид купли-продажи: параграф 3 главы 25 ГК РК, к нему
    субсидиарно применяются общие положения о купле-продаже. Квалифицирующие признаки — предпринимательский
    статус поставщика и цель приобретения товара для предпринимательской деятельности, а не для личного
    потребления; при их отсутствии применяются нормы о розничной купле-продаже с защитой прав потребителя.
    Поставка товаров для государственных нужд и закупок квазигосударственного сектора регулируется Законом РК
    «О государственных закупках» и подзаконными актами: типовая форма договора там обязательна и приоритетна.
    Поставка отдельных категорий товаров (алкоголь, лекарственные средства, нефтепродукты, пищевая продукция)
    требует лицензий, деклараций и сопроводительных накладных.
  en: >-
    Supply is a sub-type of sale under chapter 25; public-procurement supply follows a mandatory template
    under the Public Procurement Law.
legal_basis:
  - {act: ГК РК, article: '458', note: 'договор поставки, гл. 25 § 3'}
  - {act: ГК РК, article: '459–462', note: 'периоды поставки, порядок и отгрузочные разнарядки'}
  - {act: ГК РК, article: '463–470', note: 'ассортимент, качество, комплектность, тара и упаковка'}
  - {act: ГК РК, article: '471–473', note: 'принятие товара покупателем и ответственное хранение'}
  - {act: ГК РК, article: '407', note: 'условие о товаре: наименование и количество'}
  - {act: ГК РК, article: '393', note: 'существенные условия договора'}
parties:
  - role: {ru: 'Поставщик', kk: 'Жеткізуші', en: 'Supplier'}
    kinds: [legal, ip]
  - role: {ru: 'Покупатель', kk: 'Сатып алушы', en: 'Buyer'}
    kinds: [legal, ip]
fields:
  - name: goods_description
    label: {ru: 'Наименование и описание товаров', kk: 'Тауарлардың атауы мен сипаттамасы', en: 'Goods description'}
    type: textarea
    group: subject
    required: true
    hint:
      ru: >-
        Наименование, марка, артикул, ГОСТ или ТУ, страна происхождения. Развёрнутый перечень выносится в
        спецификацию, которая является приложением к договору.
    example:
      ru: >-
        Цемент портландский ПЦ 400-Д20 в мешках по 50 кг, производитель — АО «Стандарт Цемент», сертификат соответствия СТ РК 1234-2020.
      kk: >-
        50 кг қаптардағы ПЦ 400-Д20 портландцементі, өндіруші — «Стандарт Цемент» АҚ.
  - name: quantity
    label: {ru: 'Количество товаров', kk: 'Тауарлардың саны', en: 'Quantity'}
    type: text
    group: subject
    required: true
    hint:
      ru: >-
        Общее количество или порядок его определения по заявкам покупателя в пределах согласованного объёма.
    example:
      ru: '600 тонн (12 000 мешков) с разбивкой по графику'
      kk: '600 тонна (12 000 қап), кесте бойынша бөлінеді'
  - name: assortment
    label: {ru: 'Ассортимент и комплектность', kk: 'Ассортимент және жиынтықтылық', en: 'Assortment and completeness'}
    type: textarea
    group: subject
    required: false
    example:
      ru: 'ПЦ 400-Д20 — 400 тонн; ПЦ 500-Д0 — 200 тонн'
      kk: 'ПЦ 400-Д20 — 400 тонна; ПЦ 500-Д0 — 200 тонна'
  - name: quality_standard
    label: {ru: 'Требования к качеству', kk: 'Сапаға қойылатын талаптар', en: 'Quality standard'}
    type: textarea
    group: subject
    required: false
    hint:
      ru: >-
        Стандарт, технические условия, сертификат соответствия, срок годности на момент поставки (например,
        не менее 80 процентов остаточного срока).
    example:
      ru: >-
        СТ РК 1234-2020, каждая партия сопровождается паспортом качества завода-изготовителя.
      kk: >-
        СТ ҚР 1234-2020, әр партия дайындаушы зауыттың сапа паспортымен ілеседі.
  - name: total_amount
    label: {ru: 'Общая сумма поставки', kk: 'Жеткізудің жалпы сомасы', en: 'Total contract value'}
    type: money
    group: terms
    required: true
    unit: тенге
    hint:
      ru: >-
        Общая цена договора или порядок её определения по ценам спецификации. Укажите включение НДС и условия
        изменения цены.
    example:
      ru: '27 600 000'
  - name: delivery_schedule
    label: {ru: 'График и периоды поставки', kk: 'Жеткізу кестесі мен кезеңдері', en: 'Delivery schedule'}
    type: textarea
    group: terms
    required: true
    hint:
      ru: >-
        Периоды поставки партиями, сроки исполнения заявок покупателя, допустимость досрочной поставки.
    example:
      ru: >-
        Партиями по 100 тонн ежемесячно с октября 2026 года по март 2027 года, отгрузка до 10 числа каждого месяца.
      kk: >-
        2026 жылғы қазаннан 2027 жылғы наурызға дейін ай сайын 100 тоннадан партиялармен, әр айдың 10-күніне дейін тиеу.
  - name: delivery_address
    label: {ru: 'Место (адрес) поставки', kk: 'Жеткізу орны', en: 'Delivery address'}
    type: text
    group: terms
    required: true
    example:
      ru: 'г. Астана, промзона Индустриальная, ул. Складская, 7, склад № 4'
      kk: 'Астана қ., Индустриалды өнеркәсіп аймағы, Қоймалық к-сі, 7, № 4 қойма'
  - name: delivery_basis
    label: {ru: 'Базис поставки', kk: 'Жеткізу базисі', en: 'Delivery basis'}
    type: select
    group: terms
    required: false
    options:
      - {value: supplier, label: {ru: Доставка силами и за счёт поставщика, kk: Жеткізушінің күшімен, en: Delivered by supplier}}
      - {value: pickup, label: {ru: Выборка (самовывоз) покупателем, kk: Сатып алушының өзі әкетуі, en: Collected by buyer}}
      - {value: carrier, label: {ru: Передача перевозчику, kk: Тасымалдаушыға беру, en: Handover to carrier}}
      - {value: incoterms, label: {ru: По правилам Инкотермс, kk: Инкотермс ережелері бойынша, en: Per Incoterms}}
  - name: payment_terms
    label: {ru: 'Порядок расчётов', kk: 'Есеп айырысу тәртібі', en: 'Payment terms'}
    type: select
    group: terms
    required: true
    options:
      - {value: prepayment, label: {ru: Предоплата 100%, kk: 100% алдын ала төлем, en: 100% prepayment}}
      - {value: postpayment, label: {ru: Отсрочка платежа после поставки, kk: Жеткізілгеннен кейін кейінге қалдырылған төлем, en: Deferred payment after delivery}}
      - {value: partial_prepayment, label: {ru: Частичная предоплата, kk: Ішінара алдын ала төлем, en: Partial prepayment}}
      - {value: on_delivery, label: {ru: Оплата по факту каждой партии, kk: Әр партия бойынша төлем, en: Payment per consignment}}
    example:
      ru: 'postpayment'
  - name: payment_days
    label: {ru: 'Срок оплаты после поставки', kk: 'Жеткізілгеннен кейінгі төлем мерзімі', en: 'Payment period after delivery'}
    type: number
    group: terms
    required: false
    unit: банковских дней
    example:
      ru: '15'
  - name: packaging
    label: {ru: 'Требования к таре и упаковке', kk: 'Ыдыс пен қаптамаға қойылатын талаптар', en: 'Packaging requirements'}
    type: textarea
    group: extra
    required: false
    hint:
      ru: >-
        Вид тары, маркировка, возвратность тары и срок её возврата, требования к паллетированию и температурному
        режиму.
    example:
      ru: >-
        Мешки по 50 кг на европоддонах, обтянутых стретч-плёнкой, по 40 мешков на поддон.
      kk: >-
        Еуроподдондардағы 50 кг қаптар, стретч-үлдірмен оралған, поддонға 40 қаптан.
  - name: acceptance_terms
    label: {ru: 'Порядок приёмки по количеству и качеству', kk: 'Саны мен сапасы бойынша қабылдау тәртібі', en: 'Acceptance procedure'}
    type: textarea
    group: extra
    required: false
  - name: penalty_rate
    label: {ru: 'Неустойка за просрочку', kk: 'Мерзімін өткізгені үшін тұрақсыздық айыбы', en: 'Late penalty'}
    type: number
    group: extra
    required: false
    unit: '% в день'
    example:
      ru: '0.1'
sections:
  - key: subject
    title: {ru: 'Предмет договора', kk: 'Шарттың мәні', en: 'Subject matter'}
    guidance:
      ru: >-
        Указать, что поставщик обязуется передавать товары в обусловленные сроки для использования в
        предпринимательской деятельности, а покупатель — принимать и оплачивать их. Определить наименование и
        количество товара непосредственно либо через спецификацию, которая является неотъемлемой частью
        договора. Сослаться на ст. 458 ГК РК и п. 2 ст. 407 ГК РК. Указать заверение поставщика о наличии у
        него прав на товар, необходимых лицензий, сертификатов и разрешительных документов.
    refs:
      - {act: ГК РК, article: '458'}
      - {act: ГК РК, article: '407', note: 'п. 2'}
  - key: quantity_assortment
    title: {ru: 'Количество и ассортимент', kk: 'Саны және ассортименті', en: 'Quantity and assortment'}
    guidance:
      ru: >-
        Определить общее количество и ассортимент по позициям спецификации либо порядок их согласования
        заявками покупателя: форма заявки, срок её направления, срок подтверждения поставщиком, последствия
        неподтверждения. Указать допустимое отклонение по количеству и последствия недопоставки: восполнение в
        следующем периоде, право покупателя приобрести товар у третьих лиц с отнесением разницы в цене на
        поставщика.
    refs:
      - {act: ГК РК, article: '459–463'}
  - key: quality
    title: {ru: 'Качество, комплектность и документы', kk: 'Сапасы, жиынтықтылығы және құжаттар', en: 'Quality, completeness and documents'}
    guidance:
      ru: >-
        Указать стандарт качества (ГОСТ, ТУ, техрегламент ЕАЭС), требование к остаточному сроку годности,
        комплектность и принадлежности, гарантийный срок и его исчисление. Перечислить документы, передаваемые
        с каждой партией: накладная, счёт-фактура, сертификат соответствия, паспорт качества, инструкция на
        государственном и русском языках. Описать последствия поставки товара ненадлежащего качества:
        замена, доукомплектование, уменьшение цены, возврат.
    refs:
      - {act: ГК РК, article: '464–468'}
  - key: delivery
    title: {ru: 'Сроки и порядок поставки', kk: 'Жеткізу мерзімдері мен тәртібі', en: 'Delivery terms'}
    guidance:
      ru: >-
        Установить периоды поставки, срок исполнения заявки, базис поставки и распределение транспортных
        расходов, допустимость досрочной поставки только с согласия покупателя. Прямо указать момент перехода
        права собственности и момент перехода риска случайной гибели, а также лицо, уполномоченное принимать
        товар (доверенность). Описать порядок поставки по отгрузочной разнарядке, если товар получает третье лицо.
    refs:
      - {act: ГК РК, article: '460–462'}
  - key: price
    title: {ru: 'Цена и порядок расчётов', kk: 'Бағасы және есеп айырысу тәртібі', en: 'Price and payments'}
    guidance:
      ru: >-
        Указать цены за единицу по спецификации, общую сумму договора, включение НДС и валюту расчётов (тенге).
        Определить условия и порядок изменения цены (фиксированная на срок договора либо пересмотр с
        уведомлением за определённый срок). Установить срок оплаты в банковских днях от даты поставки или от
        даты получения счёта-фактуры, порядок сверки взаиморасчётов (акт сверки, периодичность, срок подписания).
  - key: packaging
    title: {ru: 'Тара, упаковка и маркировка', kk: 'Ыдыс, қаптама және таңбалау', en: 'Packaging and marking'}
    guidance:
      ru: >-
        Определить требования к таре и упаковке, обеспечивающие сохранность товара при обычных условиях
        перевозки и хранения, требования к маркировке (в том числе на государственном языке), возвратность тары,
        срок и порядок её возврата, ответственность за повреждение тары.
    refs:
      - {act: ГК РК, article: '469–470'}
  - key: acceptance
    title: {ru: 'Приёмка товара', kk: 'Тауарды қабылдау', en: 'Acceptance of goods'}
    guidance:
      ru: >-
        Описать приёмку по количеству и качеству: срок осмотра при получении, срок выявления скрытых недостатков,
        порядок вызова представителя поставщика (срок уведомления и срок прибытия), составление акта о
        расхождениях, привлечение независимой экспертизы и распределение её расходов. Указать обязанность
        покупателя принять товар на ответственное хранение при отказе от него и право поставщика вывезти товар.
    refs:
      - {act: ГК РК, article: '471–473'}
  - key: rights_obligations
    title: {ru: 'Права и обязанности сторон', kk: 'Тараптардың құқықтары мен міндеттері', en: 'Rights and obligations'}
    guidance:
      ru: >-
        Обязанности поставщика: поставлять товар согласованного качества в срок, комплектно, с полным пакетом
        документов, уведомлять о невозможности поставки. Обязанности покупателя: направлять заявки, обеспечить
        приёмку и разгрузку, оплачивать в срок, возвращать тару. Права сторон сформулировать зеркально, включая
        право поставщика приостановить отгрузку при просрочке оплаты.
  - key: liability
    title: {ru: 'Ответственность сторон', kk: 'Тараптардың жауапкершілігі', en: 'Liability'}
    guidance:
      ru: >-
        Установить неустойку за недопоставку и просрочку поставки, за просрочку оплаты, за поставку
        некачественного товара, с указанием базы начисления и предельного размера. Указать основания
        одностороннего отказа от исполнения при существенном нарушении: неоднократная поставка товаров
        ненадлежащего качества, неоднократная просрочка поставки, неоднократная просрочка оплаты или
        невыборка товара. Сослаться на ст. 293 и 359 ГК РК.
    refs:
      - {act: ГК РК, article: '293'}
      - {act: ГК РК, article: '359'}
  - key: force_majeure
    title: {ru: 'Обстоятельства непреодолимой силы', kk: 'Еңсерілмейтін күш жағдайлары', en: 'Force majeure'}
    guidance:
      ru: >-
        Перечень обстоятельств, включая запреты и ограничения ввоза и вывоза, срок уведомления, подтверждение
        справкой НПП «Атамекен» или иного компетентного органа, продление сроков и право расторжения при
        длительности свыше согласованного периода.
    refs:
      - {act: ГК РК, article: '359', note: 'п. 2'}
  - key: disputes
    title: {ru: 'Порядок разрешения споров', kk: 'Дауларды шешу тәртібі', en: 'Dispute resolution'}
    guidance:
      ru: >-
        Претензионный порядок со сроком ответа на претензию, затем подсудность специализированному
        межрайонному экономическому суду либо арбитражу. Применимое право — право Республики Казахстан.
  - key: term
    title: {ru: 'Срок действия договора', kk: 'Шарттың қолданылу мерзімі', en: 'Term'}
    guidance:
      ru: >-
        Указать срок действия договора, порядок автоматической пролонгации и порядок одностороннего отказа с
        письменным уведомлением за определённое время, а также обязанность завершить расчёты по фактически
        поставленным партиям.
  - key: final
    title: {ru: 'Заключительные положения', kk: 'Қорытынды ережелер', en: 'Final provisions'}
    guidance:
      ru: >-
        Порядок изменения, статус спецификаций и заявок как неотъемлемых частей договора, юридическая сила
        электронных документов и электронных счетов-фактур, антикоррупционная оговорка, порядок уведомлений,
        перечень приложений.
  - key: requisites
    title: {ru: 'Реквизиты и подписи сторон', kk: 'Тараптардың деректемелері мен қолдары', en: 'Details and signatures'}
    guidance:
      ru: >-
        Полные реквизиты сторон: наименование, БИН, адрес, банковские реквизиты, статус плательщика НДС и номер
        свидетельства, контакты, ФИО и должность подписанта и основание полномочий.
essential_terms:
  - key: subject
    label: {ru: 'Наименование и количество поставляемого товара', kk: 'Жеткізілетін тауардың атауы мен саны', en: 'Name and quantity of the goods'}
    fields: [goods_description, quantity]
    section: subject
    basis: {act: ГК РК, article: '407', note: 'п. 2'}
  - key: delivery_period
    label: {ru: 'Сроки (периоды) поставки', kk: 'Жеткізу мерзімдері', en: 'Delivery periods'}
    fields: [delivery_schedule]
