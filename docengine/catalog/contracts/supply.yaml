risks:
  - party: 0
    text:
      ru: >-
        Покупатель принял товар с отсрочкой платежа и не рассчитался; товар уже перепродан.
    mitigation:
      ru: >-
        Установить лимит отгрузки в кредит, сохранение права собственности до оплаты, неустойку и право
        приостановить отгрузки при просрочке.
  - party: 0
    text:
      ru: >-
        Покупатель не выбирает согласованный объём, а товар закуплен под него.
    mitigation:
      ru: >-
        Согласовать твёрдые объёмы по периодам, ответственность за невыборку и право требовать оплаты
        невыбранного товара по ст. 471 ГК РК.
  - party: 0
    text:
      ru: >-
        Претензии по качеству заявляются спустя месяцы, без акта и без вызова представителя.
    mitigation:
      ru: >-
        Установить сжатые сроки приёмки и предъявления претензий, обязательный вызов представителя и порядок
        независимой экспертизы.
  - party: 1
    text:
      ru: >-
        Внесена предоплата, а поставка сорвана или произведена частично.
    mitigation:
      ru: >-
        Ограничить размер предоплаты, предусмотреть возврат аванса с процентами, неустойку за недопоставку и
        право приобрести товар у третьих лиц за счёт поставщика.
  - party: 1
    text:
      ru: >-
        Поставщик в одностороннем порядке повышает цены в течение срока договора.
    mitigation:
      ru: >-
        Зафиксировать цены спецификацией на весь срок либо ограничить пересмотр периодичностью и предельным
        процентом с правом покупателя отказаться от изменения.
  - party: 1
    text:
      ru: >-
        Товар поставлен без сертификатов и сопроводительных документов, из-за чего невозможен вычет НДС и
        дальнейшая реализация.
    mitigation:
      ru: >-
        Закрепить перечень обязательных документов на каждую партию, срок их предоставления и неустойку за
        непередачу или задержку выписки электронного счёта-фактуры.
